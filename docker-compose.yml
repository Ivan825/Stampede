# The full Stampede stack on one machine:
#
#   docker compose up -d        then open http://localhost:8080
#
# - db:        TimescaleDB for runs, metrics and reports
# - server:    API, run manager and web UI on :8080
# - worker-1/2: load generators that connect to the server
# - shoplab:   the demo target app with six planted bottlenecks (on :8090)
#
# Everything except the UI (8080) and ShopLab (8090) stays on the internal
# network. The defaults below suit a laptop; change the passwords and the
# join token before exposing anything.
#
# Optional profiles add more services:
#
#   --profile browser         a worker with Chromium for browser steps
#   --profile observability   Prometheus (:9090), Grafana (:3000) and
#                             Jaeger (:16686) for the server's own metrics
#                             and traces; set STAMPEDE_OTLP_ENDPOINT to
#                             http://jaeger:4318 to send traces
name: stampede

include:
  - examples/shoplab/docker-compose.yml

services:
  db:
    image: timescale/timescaledb:2.22.1-pg17
    environment:
      POSTGRES_USER: stampede
      POSTGRES_PASSWORD: ${STAMPEDE_DB_PASSWORD:-stampede}
      POSTGRES_DB: stampede
    volumes:
      - stampede-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stampede -d stampede"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  server:
    build: .
    image: ghcr.io/ivan825/stampede:${STAMPEDE_VERSION:-local}
    command: ["server"]
    ports:
      - "${STAMPEDE_PORT:-8080}:8080"
    environment:
      STAMPEDE_DATABASE_URL: postgres://stampede:${STAMPEDE_DB_PASSWORD:-stampede}@db:5432/stampede?sslmode=disable
      STAMPEDE_JOIN_TOKEN: ${STAMPEDE_JOIN_TOKEN:-local-compose-join-token}
      STAMPEDE_MASTER_KEY_FILE: /data/master.key
      STAMPEDE_MASTER_KEY_AUTOGEN: "true"
      # Workers enroll for their own certificates from a CA derived from
      # the master key; the join token never crosses the network.
      STAMPEDE_WORKER_MTLS: "true"
      STAMPEDE_LOG_FORMAT: text
      # CSV/JSON feeder files for runs. ShopLab's data folder is mounted so
      # its scenarios (which read ../data/users.csv) work unchanged.
      STAMPEDE_DATA_DIR: /srv/data
      # Tracing is off while this is empty; the observability profile's
      # Jaeger receives OTLP at http://jaeger:4318.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${STAMPEDE_OTLP_ENDPOINT:-}
    volumes:
      - stampede-data:/data
      - ./examples/shoplab/data:/srv/data/data:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/stampede", "healthcheck", "http://localhost:8080/readyz"]
      interval: 3s
      timeout: 4s
      retries: 20
    restart: unless-stopped

  worker-1: &worker
    image: ghcr.io/ivan825/stampede:${STAMPEDE_VERSION:-local}
    command: ["worker", "--server", "server:8081", "--mtls", "--name", "worker-1", "--region", "local"]
    environment:
      STAMPEDE_JOIN_TOKEN: ${STAMPEDE_JOIN_TOKEN:-local-compose-join-token}
    volumes:
      - ./examples/shoplab/data:/srv/data/data:ro
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  worker-2:
    <<: *worker
    command: ["worker", "--server", "server:8081", "--mtls", "--name", "worker-2", "--region", "local"]

  # --profile browser: a worker with Chromium, for scenarios with browser
  # steps. The other workers refuse such runs.
  browser-worker:
    <<: *worker
    profiles: [browser]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.browser-worker
    image: ghcr.io/ivan825/stampede-browser-worker:${STAMPEDE_VERSION:-local}
    command: ["worker", "--server", "server:8081", "--mtls", "--name", "browser-worker", "--region", "local"]

  # --profile observability: the server's own metrics and traces.
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports:
      - "${STAMPEDE_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - stampede-prometheus:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [observability]
    ports:
      - "${STAMPEDE_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${STAMPEDE_GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/stampede/stampede-server.json
    volumes:
      - ./deploy/compose/grafana/datasources.yml:/etc/grafana/provisioning/datasources/stampede.yml:ro
      - ./deploy/compose/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/stampede.yml:ro
      - ./deploy/grafana/stampede-server.json:/etc/grafana/dashboards/stampede/stampede-server.json:ro
      - stampede-grafana:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  jaeger:
    # All in one: OTLP on 4317 (gRPC) and 4318 (HTTP), the UI on 16686,
    # traces kept in memory.
    image: jaegertracing/jaeger:2.9.0
    profiles: [observability]
    environment:
      # Listen on the Compose network, not only inside the container.
      JAEGER_LISTEN_HOST: 0.0.0.0
    ports:
      - "${STAMPEDE_JAEGER_PORT:-16686}:16686"
    restart: unless-stopped

volumes:
  stampede-db:
  stampede-data:
  stampede-prometheus:
  stampede-grafana:
