# The full Stampede stack on one machine:
#
#   docker compose up -d        then open http://localhost:8080
#
# - db:        TimescaleDB for runs, metrics and reports
# - server:    API, run manager and web UI on :8080
# - worker-1/2: load generators that connect to the server
# - shoplab:   the demo target app with six planted bottlenecks (on :8090)
#
# Everything except the UI (8080) and ShopLab (8090) stays on the internal
# network. The defaults below suit a laptop; change the passwords and the
# join token before exposing anything.
name: stampede

include:
  - examples/shoplab/docker-compose.yml

services:
  db:
    image: timescale/timescaledb:2.22.1-pg17
    environment:
      POSTGRES_USER: stampede
      POSTGRES_PASSWORD: ${STAMPEDE_DB_PASSWORD:-stampede}
      POSTGRES_DB: stampede
    volumes:
      - stampede-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stampede -d stampede"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  server:
    build: .
    image: ghcr.io/ivan825/stampede:${STAMPEDE_VERSION:-local}
    command: ["server"]
    ports:
      - "${STAMPEDE_PORT:-8080}:8080"
    environment:
      STAMPEDE_DATABASE_URL: postgres://stampede:${STAMPEDE_DB_PASSWORD:-stampede}@db:5432/stampede?sslmode=disable
      STAMPEDE_JOIN_TOKEN: ${STAMPEDE_JOIN_TOKEN:-local-compose-join-token}
      STAMPEDE_MASTER_KEY_FILE: /data/master.key
      STAMPEDE_MASTER_KEY_AUTOGEN: "true"
      # Workers enroll for their own certificates from a CA derived from
      # the master key; the join token never crosses the network.
      STAMPEDE_WORKER_MTLS: "true"
      STAMPEDE_LOG_FORMAT: text
      # CSV/JSON feeder files for runs. ShopLab's data folder is mounted so
      # its scenarios (which read ../data/users.csv) work unchanged.
      STAMPEDE_DATA_DIR: /srv/data
    volumes:
      - stampede-data:/data
      - ./examples/shoplab/data:/srv/data/data:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/stampede", "healthcheck", "http://localhost:8080/readyz"]
      interval: 3s
      timeout: 4s
      retries: 20
    restart: unless-stopped

  worker-1: &worker
    image: ghcr.io/ivan825/stampede:${STAMPEDE_VERSION:-local}
    command: ["worker", "--server", "server:8081", "--mtls", "--name", "worker-1", "--region", "local"]
    environment:
      STAMPEDE_JOIN_TOKEN: ${STAMPEDE_JOIN_TOKEN:-local-compose-join-token}
    volumes:
      - ./examples/shoplab/data:/srv/data/data:ro
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  worker-2:
    <<: *worker
    command: ["worker", "--server", "server:8081", "--mtls", "--name", "worker-2", "--region", "local"]

volumes:
  stampede-db:
  stampede-data:
