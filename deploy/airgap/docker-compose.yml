# Stampede for an air-gapped network: the images come from the bundle
# (./install.sh loads them) and are never pulled.
#
#   docker compose -f compose/docker-compose.yml up -d   then open http://localhost:8080
name: stampede

services:
  db:
    image: timescale/timescaledb:2.22.1-pg17
    pull_policy: never
    environment:
      POSTGRES_USER: stampede
      POSTGRES_PASSWORD: ${STAMPEDE_DB_PASSWORD:-stampede}
      POSTGRES_DB: stampede
    volumes:
      - stampede-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stampede -d stampede"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  server:
    image: ghcr.io/ivan825/stampede:__VERSION__
    pull_policy: never
    command: ["server"]
    ports:
      - "${STAMPEDE_PORT:-8080}:8080"
    environment:
      STAMPEDE_DATABASE_URL: postgres://stampede:${STAMPEDE_DB_PASSWORD:-stampede}@db:5432/stampede?sslmode=disable
      STAMPEDE_JOIN_TOKEN: ${STAMPEDE_JOIN_TOKEN:?set STAMPEDE_JOIN_TOKEN to a long random secret}
      STAMPEDE_MASTER_KEY_FILE: /data/master.key
      STAMPEDE_MASTER_KEY_AUTOGEN: "true"
      STAMPEDE_WORKER_MTLS: "true"
      STAMPEDE_DATA_DIR: /srv/data
    volumes:
      - stampede-data:/data
      - ${STAMPEDE_DATA_DIR_HOST:-./data}:/srv/data:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/stampede", "healthcheck", "http://localhost:8080/readyz"]
      interval: 3s
      timeout: 4s
      retries: 20
    restart: unless-stopped

  worker:
    image: ghcr.io/ivan825/stampede:__VERSION__
    pull_policy: never
    command: ["worker", "--server", "server:8081", "--mtls", "--region", "local"]
    environment:
      STAMPEDE_JOIN_TOKEN: ${STAMPEDE_JOIN_TOKEN}
    volumes:
      - ${STAMPEDE_DATA_DIR_HOST:-./data}:/srv/data:ro
    depends_on:
      server:
        condition: service_healthy
    deploy:
      replicas: ${STAMPEDE_WORKERS:-2}
    restart: unless-stopped

  # Workers with Chromium for scenarios with browser steps:
  #   docker compose -f compose/docker-compose.yml --profile browser up -d
  browser-worker:
    image: ghcr.io/ivan825/stampede-browser-worker:__VERSION__
    pull_policy: never
    profiles: [browser]
    command: ["worker", "--server", "server:8081", "--mtls", "--region", "local"]
    environment:
      STAMPEDE_JOIN_TOKEN: ${STAMPEDE_JOIN_TOKEN}
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  stampede-db:
  stampede-data:
