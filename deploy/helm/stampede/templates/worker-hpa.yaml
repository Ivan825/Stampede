{{- if and .Values.workers.enabled .Values.workers.autoscaling.enabled }}
# Scales workers on CPU with the built-in HPA (needs metrics-server; no KEDA).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "stampede.fullname" . }}-worker
  labels:
    {{- include "stampede.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "stampede.fullname" . }}-worker
  minReplicas: {{ .Values.workers.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.workers.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.workers.autoscaling.targetCPUUtilizationPercentage }}
  {{- with .Values.workers.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- else }}
  # Scale down slowly: removing a worker mid-run loses its share of the load.
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
  {{- end }}
{{- end }}
