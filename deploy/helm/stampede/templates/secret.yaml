{{- include "stampede.validate" . }}
{{- $old := include "stampede.existingSecretData" . | fromJson }}
{{- $needMaster := not .Values.masterKey.existingSecret }}
{{- $needJoin := not .Values.joinToken.existingSecret }}
{{- $needDBPass := and .Values.timescaledb.enabled (not .Values.timescaledb.existingSecret) }}
{{- $needURL := and (not .Values.timescaledb.enabled) .Values.database.external.url }}
{{- if or $needMaster $needJoin $needDBPass $needURL }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stampede.secretName" . }}
  labels:
    {{- include "stampede.labels" . | nindent 4 }}
  annotations:
    # Kept on `helm uninstall`: losing the master key makes stored secrets
    # unreadable. Delete it by hand once the database is gone too.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $needMaster }}
  {{- if .Values.masterKey.value }}
  master-key: {{ .Values.masterKey.value | b64enc | quote }}
  {{- else if hasKey $old "master-key" }}
  master-key: {{ get $old "master-key" | quote }}
  {{- else }}
  {{- /* 32 random bytes, base64: the format `stampede keygen` prints. */}}
  master-key: {{ randBytes 32 | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if $needJoin }}
  {{- if .Values.joinToken.value }}
  join-token: {{ .Values.joinToken.value | b64enc | quote }}
  {{- else if hasKey $old "join-token" }}
  join-token: {{ get $old "join-token" | quote }}
  {{- else }}
  join-token: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if $needDBPass }}
  {{- if .Values.timescaledb.password }}
  postgres-password: {{ .Values.timescaledb.password | b64enc | quote }}
  {{- else if hasKey $old "postgres-password" }}
  postgres-password: {{ get $old "postgres-password" | quote }}
  {{- else }}
  postgres-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if $needURL }}
  database-url: {{ .Values.database.external.url | b64enc | quote }}
  {{- end }}
{{- end }}
