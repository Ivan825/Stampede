apiVersion: v1
kind: Service
metadata:
  name: {{ include "stampede.fullname" . }}
  labels:
    {{- include "stampede.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "stampede.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
    - name: workers
      port: {{ .Values.service.workerPort }}
      targetPort: workers
      protocol: TCP
      appProtocol: grpc
