{{- $image := .Values.tests.image | default (include "stampede.image" .) }}
{{- range $i, $path := list "/readyz" "/api/v1/version" }}
{{- if $i }}
---
{{- end }}
# `helm test` checks the server answers 200 on {{ $path }} through its Service.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "stampede.fullname" $ }}-test-{{ trimPrefix "/" $path | replace "/" "-" }}
  labels:
    {{- include "stampede.labels" $ | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: check
      image: {{ $image }}
      imagePullPolicy: {{ $.Values.image.pullPolicy }}
      args:
        - healthcheck
        - http://{{ include "stampede.fullname" $ }}:{{ $.Values.service.httpPort }}{{ $path }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
{{- end }}
