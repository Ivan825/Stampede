version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Connect is a single bidirectional stream of two envelope messages;
    # Connect{Request,Response} names would say less than WorkerMessage
    # and ServerMessage.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - WIRE_JSON
