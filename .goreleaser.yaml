# GoReleaser configuration for Stampede releases.
#
#   goreleaser check
#   goreleaser release --snapshot --clean --skip=publish,sign   # local dry run
#
# A tag v* triggers .github/workflows/release.yml, which runs the full release:
# binaries and archives for six platforms, checksums, SBOMs (syft), multi-arch
# distroless images on ghcr.io, keyless cosign signatures (GitHub OIDC), a
# changelog grouped by conventional-commit type, and (when their tokens are
# configured) a Homebrew cask and a Scoop manifest.
version: 2

project_name: stampede

before:
  hooks:
    - go mod download

builds:
  - id: stampede
    main: ./cmd/stampede
    binary: stampede
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/Ivan825/Stampede/internal/version.Version={{ .Version }}
      - -X github.com/Ivan825/Stampede/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/Ivan825/Stampede/internal/version.Date={{ .CommitDate }}
    # Builds are reproducible: the file times come from the commit, not the clock.
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  # The Kubernetes operator, a separate Go module. Shipped only as an image.
  - id: operator
    dir: deploy/operator
    main: ./cmd
    binary: manager
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux]
    goarch: [amd64, arm64]

archives:
  - id: stampede
    ids: [stampede]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

# One SPDX SBOM per archive, generated by syft.
sboms:
  - id: archives
    artifacts: archive

# Keyless signing of the checksum file. In GitHub Actions cosign gets an
# identity token from the workflow's OIDC provider (id-token: write), so there
# is no key to manage. Verify with:
#   cosign verify-blob --bundle stampede_<v>_checksums.txt.sigstore.json \
#     --certificate-identity-regexp 'https://github.com/Ivan825/Stampede/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     stampede_<v>_checksums.txt
signs:
  - id: checksum
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes
    output: true

# Multi-arch images built with buildx from the binaries above (no Go build
# inside Docker). Distroless static, nonroot, /data owned by 65532, like the
# repository Dockerfile.
dockers_v2:
  - id: stampede
    ids: [stampede]
    dockerfile: deploy/docker/Dockerfile.release
    images:
      - ghcr.io/ivan825/stampede
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: true
    labels:
      org.opencontainers.image.title: stampede
      org.opencontainers.image.description: Self-hosted distributed load testing
      org.opencontainers.image.source: https://github.com/Ivan825/Stampede
      org.opencontainers.image.url: https://github.com/Ivan825/Stampede
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"

  - id: browser-worker
    ids: [stampede]
    dockerfile: deploy/docker/Dockerfile.browser-worker.release
    images:
      - ghcr.io/ivan825/stampede-browser-worker
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: true
    labels:
      org.opencontainers.image.title: stampede-browser-worker
      org.opencontainers.image.description: Stampede worker with Chromium for browser steps
      org.opencontainers.image.source: https://github.com/Ivan825/Stampede
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"

  - id: operator
    ids: [operator]
    dockerfile: deploy/docker/Dockerfile.operator.release
    images:
      - ghcr.io/ivan825/stampede-operator
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: true
    labels:
      org.opencontainers.image.title: stampede-operator
      org.opencontainers.image.description: Kubernetes operator for Stampede (StampedeCluster, StampedeRun)
      org.opencontainers.image.source: https://github.com/Ivan825/Stampede
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"

# Keyless signature of each pushed image, by digest.
#   cosign verify ghcr.io/ivan825/stampede:<v> \
#     --certificate-identity-regexp 'https://github.com/Ivan825/Stampede/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
docker_signs:
  - id: images
    cmd: cosign
    args:
      - sign
      - ${artifact}@${digest}
      - --yes
    output: true

# Homebrew cask in Ivan825/homebrew-tap (brew install ivan825/tap/stampede).
# Skipped unless HOMEBREW_TAP_GITHUB_TOKEN is set: the default GITHUB_TOKEN
# cannot push to another repository.
homebrew_casks:
  - name: stampede
    ids: [stampede]
    binaries: [stampede]
    repository:
      owner: Ivan825
      name: homebrew-tap
      token: '{{ index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}'
    directory: Casks
    homepage: https://github.com/Ivan825/Stampede
    description: Self-hosted distributed load testing
    license: Apache-2.0
    commit_author:
      name: stampede-release-bot
      email: ivan.bhargava@iiitb.ac.in
    commit_msg_template: "stampede {{ .Tag }}"
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    # The binaries are not notarised, so remove the quarantine flag macOS sets
    # on downloads; otherwise Gatekeeper refuses to start stampede.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/stampede"]
          end

# Scoop manifest in Ivan825/scoop-bucket (scoop bucket add ivan825
# https://github.com/Ivan825/scoop-bucket; scoop install stampede).
# Skipped unless SCOOP_BUCKET_GITHUB_TOKEN is set.
scoops:
  - name: stampede
    ids: [stampede]
    repository:
      owner: Ivan825
      name: scoop-bucket
      token: '{{ index .Env "SCOOP_BUCKET_GITHUB_TOKEN" }}'
    homepage: https://github.com/Ivan825/Stampede
    description: Self-hosted distributed load testing
    license: Apache-2.0
    commit_author:
      name: stampede-release-bot
      email: ivan.bhargava@iiitb.ac.in
    commit_msg_template: "stampede {{ .Tag }}"
    skip_upload: '{{ if index .Env "SCOOP_BUCKET_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: git
  abbrev: 7
  filters:
    exclude:
      - "^docs?(\\(.*\\))?:"
      - "^test(\\(.*\\))?:"
      - "^style(\\(.*\\))?:"
      - "^chore(\\(.*\\))?:"
      - "^Merge "
  groups:
    - title: Breaking changes
      regexp: '^.*?(\w+)(\(.+\))?!:.+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\(.+\))?:.+$'
      order: 1
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))?:.+$'
      order: 2
    - title: Performance
      regexp: '^.*?perf(\(.+\))?:.+$'
      order: 3
    - title: Refactoring
      regexp: '^.*?refactor(\(.+\))?:.+$'
      order: 4
    - title: Build and CI
      regexp: '^.*?(build|ci)(\(.+\))?:.+$'
      order: 5
    - title: Other changes
      order: 999

release:
  github:
    owner: Ivan825
    name: Stampede
  prerelease: auto
  footer: |
    ## Verify

    ```sh
    cosign verify-blob --bundle stampede_{{ .Version }}_checksums.txt.sigstore.json \
      --certificate-identity-regexp 'https://github.com/Ivan825/Stampede/.*' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      stampede_{{ .Version }}_checksums.txt
    cosign verify ghcr.io/ivan825/stampede:{{ .Version }} \
      --certificate-identity-regexp 'https://github.com/Ivan825/Stampede/.*' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    ```

    Container image: `ghcr.io/ivan825/stampede:{{ .Version }}`
