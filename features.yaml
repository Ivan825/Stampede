# What Stampede does today and what is planned. The website reads this file,
# so "Shipped" and "Planned" labels always match the repository. Change a
# status only when the feature works and is tested in this repo.
groups:
  - name: Measurement
    features:
      - { name: Latency from the scheduled send time (coordinated omission), status: shipped, doc: docs/concepts/measurement }
      - { name: Merged HDR-style histograms, never averaged percentiles, status: shipped, doc: docs/concepts/measurement }
      - { name: DNS, connect, TLS, wait and download timing per request, status: shipped }
      - { name: Generator saturation detection and generator-limited verdicts, status: shipped }
      - { name: Accuracy gate against a calibrated server in CI, status: shipped, doc: benchmarks }
      - { name: Side-by-side benchmarks with k6 and wrk2, status: planned }
  - name: Load
    features:
      - { name: Open (arrival rate) and closed (virtual users) models, status: shipped, doc: docs/concepts/load-models }
      - { name: "Shapes: smoke, baseline, stress, spike, soak, breakpoint, steps, recovery, wave", status: shipped, doc: test-types }
      - { name: Breakpoint search and the knee of the throughput curve, status: shipped, doc: test-types }
      - { name: "Network emulation per user: latency, jitter, bandwidth, packet loss", status: shipped, doc: test-types }
      - { name: Auto-abort on sustained errors or latency, status: shipped, doc: safety }
      - { name: Replay of recorded traffic from access logs and HAR files, status: shipped, doc: docs/guides/test-types }
      - { name: "Fault injection agent: slow, cut or kill dependencies mid-run", status: shipped, doc: docs/guides/faults }
  - name: Protocols
    features:
      - { name: HTTP/1.1 and HTTP/2 (TLS and h2c), status: shipped, doc: docs/protocols }
      - { name: GraphQL with persisted queries, status: shipped, doc: docs/protocols }
      - { name: WebSocket, status: shipped, doc: docs/protocols }
      - { name: Server-sent events with time to first event, status: shipped, doc: docs/protocols }
      - { name: gRPC unary and server streaming, status: shipped, doc: docs/protocols }
      - { name: "Browser steps in real headless Chrome, with Web Vitals", status: shipped, doc: docs/protocols }
      - { name: "Plugins: MQTT, Kafka, Redis, SQL, UDP, and an SDK to write your own", status: shipped, doc: docs/plugins }
  - name: Scale
    features:
      - { name: Distributed workers over gRPC, synchronised start, lossless merge, status: shipped, doc: how-it-works }
      - { name: Worker loss marked in reports, dead man's switch, status: shipped }
      - { name: Active-passive server replicas, status: shipped }
      - { name: Mutual TLS with a built-in certificate authority, status: shipped, doc: docs/architecture }
  - name: Workflow
    features:
      - { name: Web UI with scenario editor, live runs and reports, status: shipped }
      - { name: Terminal console with plain-language commands, status: shipped }
      - { name: HTML, JSON, JUnit and Markdown reports; CI exit codes, status: shipped, doc: docs/guides/ci }
      - { name: Release comparison with confidence intervals, status: shipped, doc: docs/guides/comparing }
      - { name: "AI journey generation from specs, recordings, logs or a browser crawl, with dry-run validation", status: shipped, doc: docs/ai }
      - { name: AI report narratives that cite every figure, status: shipped, doc: docs/ai }
      - { name: Coverage map and drift detection for saved scenarios, status: shipped, doc: docs/guides/coverage }
      - { name: Scheduled runs, status: shipped, doc: docs/guides/schedules }
      - { name: Packaged GitHub Action, status: planned }
  - name: Integrations
    features:
      - { name: Target metrics from Prometheus charted in the report, status: shipped, doc: docs/guides/integrations }
      - { name: Slowest requests per step with trace links (Jaeger, Tempo), status: shipped, doc: docs/guides/integrations }
      - { name: "Notifications: signed webhooks, Slack and Discord", status: shipped, doc: docs/guides/integrations }
      - { name: "Own telemetry: Prometheus metrics, OpenTelemetry traces, Grafana dashboard", status: shipped, doc: docs/reference/configuration }
  - name: Operate
    features:
      - { name: Docker Compose stack with the ShopLab demo app, status: shipped, doc: docs/deploy/compose }
      - { name: Helm chart, status: shipped, doc: docs/deploy/helm }
      - { name: Kubernetes operator (alpha), status: shipped, doc: docs/deploy/operator }
      - { name: Terraform examples for multi-region workers, status: shipped, doc: docs/deploy/terraform }
      - { name: Air-gapped install bundle, status: planned, doc: docs/deploy/airgap }
  - name: Safety
    features:
      - { name: Ownership verification and caps for public targets, status: shipped, doc: safety }
      - { name: Requests confined to the target and allowed hosts, status: shipped, doc: safety }
      - { name: Kill switch in the UI, CLI and API, status: shipped, doc: safety }
      - { name: Roles, API tokens, encrypted secrets, audit log, status: shipped }
      - { name: Single sign-on with OpenID Connect, status: shipped, doc: docs/reference/configuration }
