name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Scenario (redact secrets)
      render: yaml
  - type: input
    id: version
    attributes:
      label: stampede version
      description: Output of `stampede version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and architecture
