name: nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accuracy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: accuracy benchmark (full)
        run: go run ./bench/accuracy -out accuracy-${{ github.run_number }}.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: accuracy-nightly-${{ github.run_number }}
          path: accuracy-*.json
          retention-days: 90

  compare:
    # The same workload through Stampede, k6 and wrk2, each checked against
    # the echo server's ground truth.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: install k6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo grafana/k6 --pattern 'k6-*-linux-amd64.tar.gz' --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/k6-*-linux-amd64.tar.gz -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP"/k6-*-linux-amd64/k6 /usr/local/bin/k6
          k6 version
      - name: build wrk2
        # The runner image usually has both libraries; apt-get update has
        # hung for most of an hour on a slow mirror, so it runs only when one
        # is missing, and under a time limit.
        timeout-minutes: 10
        run: |
          if ! dpkg -s libssl-dev zlib1g-dev >/dev/null 2>&1; then
            sudo timeout 300 apt-get update -qq
            sudo timeout 300 apt-get install -y -qq libssl-dev zlib1g-dev
          fi
          git clone --depth 1 https://github.com/giltene/wrk2 "$RUNNER_TEMP/wrk2"
          make -C "$RUNNER_TEMP/wrk2" -j"$(nproc)"
          sudo install "$RUNNER_TEMP/wrk2/wrk" /usr/local/bin/wrk2
      - name: compare with k6 and wrk2
        run: go run ./bench/compare -out compare-${{ github.run_number }}.json
      - name: publish the figures as annotations
        # Annotations can be read without signing in, unlike artifacts, so
        # the website's benchmarks page can be updated from them.
        run: |
          jq -r '.cases[] as $c | $c.tools[] | select(.ran) |
            "::notice title=compare \($c.name)::\(.tool) (\(.measures)) p50 \(.latency.p50)ms p95 \(.latency.p95)ms p99 \(.latency.p99)ms; truth p50 \(.truth.p50)ms p95 \(.truth.p95)ms p99 \(.truth.p99)ms; within tolerance \(.withinTolerance)"' \
            compare-${{ github.run_number }}.json
      - name: every tool ran
        run: |
          jq -r '.cases[] as $c | $c.tools[] | select(.ran | not) | "::error title=compare \($c.name)::\(.tool) did not run: \(.note)"' \
            compare-${{ github.run_number }}.json | tee missing.txt
          test ! -s missing.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compare-nightly-${{ github.run_number }}
          path: compare-*.json
          retention-days: 90

  airgap:
    # Builds an offline bundle, deletes the images it holds, then installs
    # and starts Stampede from the bundle alone.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The bundle's Compose file refuses to load without it, for every
      # docker compose command, not only up.
      STAMPEDE_JOIN_TOKEN: nightly-airgap-join-token-0123456789
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v4
      - name: build the bundle
        run: deploy/airgap/build-bundle.sh nightly amd64 "$RUNNER_TEMP/airgap"
      - name: install from the bundle only
        run: |
          docker image rm ghcr.io/ivan825/stampede:nightly ghcr.io/ivan825/stampede-browser-worker:nightly timescale/timescaledb:2.22.1-pg17
          cd "$RUNNER_TEMP" && tar xzf airgap/stampede-airgap-nightly-linux-amd64.tar.gz
          cd stampede-airgap-nightly-linux-amd64
          ./install.sh
          mkdir -p compose/data
          docker compose -f compose/docker-compose.yml up -d --wait
          curl -fsS http://localhost:8080/readyz
          "bin/stampede-linux-amd64" version
      - name: workers connected
        run: |
          cd "$RUNNER_TEMP/stampede-airgap-nightly-linux-amd64"
          for i in $(seq 1 30); do
            n=$(docker compose -f compose/docker-compose.yml logs server 2>&1 | grep -c 'worker connected' || true)
            [ "$n" -ge 2 ] && exit 0
            sleep 2
          done
          docker compose -f compose/docker-compose.yml logs
          exit 1

  scale:
    # Highest arrival rate one Stampede process sustains without dropping
    # iterations or falling behind its schedule, on a hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: one-process throughput
        run: go run ./bench/scale -hold 10s -out scale-${{ github.run_number }}.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scale-nightly-${{ github.run_number }}
          path: scale-*.json
          retention-days: 90

  fuzz:
    # The scenario parser, templates, replay recordings and targets get
    # untrusted input; each fuzz test runs for two minutes. A failing
    # input is uploaded so it can be added to testdata/fuzz.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: fuzz
        run: |
          for f in FuzzParse FuzzTemplate FuzzParseRecording FuzzParseThreshold; do
            go test ./internal/scenario -run '^$' -fuzz "^$f\$" -fuzztime 2m || exit 1
          done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-failures-${{ github.run_number }}
          path: internal/scenario/testdata/fuzz
