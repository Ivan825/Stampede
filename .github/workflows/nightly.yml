name: nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accuracy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: accuracy benchmark (full)
        run: go run ./bench/accuracy -out accuracy-${{ github.run_number }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accuracy-nightly-${{ github.run_number }}
          path: accuracy-*.json
          retention-days: 90

  compare:
    # The same workload through Stampede, k6 and wrk2, each checked against
    # the echo server's ground truth.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install k6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo grafana/k6 --pattern 'k6-*-linux-amd64.tar.gz' --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/k6-*-linux-amd64.tar.gz -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP"/k6-*-linux-amd64/k6 /usr/local/bin/k6
          k6 version
      - name: build wrk2
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev zlib1g-dev
          git clone --depth 1 https://github.com/giltene/wrk2 "$RUNNER_TEMP/wrk2"
          make -C "$RUNNER_TEMP/wrk2" -j"$(nproc)"
          sudo install "$RUNNER_TEMP/wrk2/wrk" /usr/local/bin/wrk2
      - name: compare with k6 and wrk2
        run: go run ./bench/compare -out compare-${{ github.run_number }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compare-nightly-${{ github.run_number }}
          path: compare-*.json
          retention-days: 90

  airgap:
    # Builds an offline bundle, deletes the images it holds, then installs
    # and starts Stampede from the bundle alone.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v3
      - name: build the bundle
        run: deploy/airgap/build-bundle.sh nightly amd64 "$RUNNER_TEMP/airgap"
      - name: install from the bundle only
        run: |
          docker image rm ghcr.io/ivan825/stampede:nightly ghcr.io/ivan825/stampede-browser-worker:nightly timescale/timescaledb:2.22.1-pg17
          cd "$RUNNER_TEMP" && tar xzf airgap/stampede-airgap-nightly-linux-amd64.tar.gz
          cd stampede-airgap-nightly-linux-amd64
          ./install.sh
          mkdir -p compose/data
          STAMPEDE_JOIN_TOKEN=nightly-airgap-join-token-0123456789 docker compose -f compose/docker-compose.yml up -d --wait
          curl -fsS http://localhost:8080/readyz
          "bin/stampede-linux-amd64" version
      - name: workers connected
        run: |
          cd "$RUNNER_TEMP/stampede-airgap-nightly-linux-amd64"
          for i in $(seq 1 30); do
            n=$(docker compose -f compose/docker-compose.yml logs server 2>&1 | grep -c 'worker connected' || true)
            [ "$n" -ge 2 ] && exit 0
            sleep 2
          done
          docker compose -f compose/docker-compose.yml logs
          exit 1
