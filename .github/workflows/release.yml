name: release

# Pushing a tag v* publishes a release with GoReleaser (.goreleaser.yaml):
# archives, checksums, SBOMs, multi-arch images on ghcr.io/ivan825/stampede,
# keyless cosign signatures, the Helm chart on ghcr.io/ivan825/charts, and
# (when their tokens exist) the Homebrew cask and Scoop manifest.
#
# Optional repository secrets:
#   HOMEBREW_TAP_GITHUB_TOKEN  can push to Ivan825/homebrew-tap
#   SCOOP_BUCKET_GITHUB_TOKEN  can push to Ivan825/scoop-bucket
# Without them those two steps are skipped and the rest of the release runs.

on:
  push:
    # Full versions only: the moving v1 tag (for the GitHub Action) must not
    # start a release.
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: write   # create the GitHub release and upload assets
  packages: write   # push images to ghcr.io
  id-token: write   # OIDC identity for keyless cosign signing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the changelog needs the full history and tags

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: tests must pass before publishing
        run: go test -count=1 ./...

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goreleaser-dist
          path: |
            dist/*.txt
            dist/*.json
            dist/*.sigstore.json
          if-no-files-found: ignore

  airgap:
    # Offline bundles for amd64 and arm64, attached to the release.
    needs: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: azure/setup-helm@v4
      - name: build the bundle
        run: deploy/airgap/build-bundle.sh "${GITHUB_REF_NAME}" "${{ matrix.arch }}" dist/airgap
      - name: attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/airgap/*.tar.gz dist/airgap/*.sha256 --clobber

  chart:
    # The Helm chart as an OCI artifact on ghcr.io/ivan825/charts/stampede,
    # versioned with the release, and attached to the release.
    needs: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm lint deploy/helm/stampede
          helm package deploy/helm/stampede --version "$version" --app-version "$version" -d dist/chart
      - name: push to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist/chart/stampede-*.tgz oci://ghcr.io/ivan825/charts
      - name: attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/chart/stampede-*.tgz --clobber
