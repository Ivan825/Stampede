name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -s -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then echo "needs gofmt -s:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        shell: bash
        run: |
          set -o pipefail
          if ! go test -race -count=1 -coverprofile=coverage.out ./... 2>&1 | tee test.log; then
            echo "::error title=failing tests::$(grep -E -- '--- FAIL|^FAIL|panic:' test.log | head -15 | tr '\n' ' ')"
            exit 1
          fi
      - name: coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func=coverage.out | tail -1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: make build && ./bin/stampede version
      - name: cross-compile
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/stampede
          done

  accuracy-quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: accuracy (quick)
        run: go run ./bench/accuracy -quick -out accuracy.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accuracy-quick
          path: accuracy.json

  action:
    # The packaged GitHub Action (./action), built from this commit, against
    # a tiny local server: a passing run sets its outputs and a failing
    # target fails the step.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: start the echo server
        run: |
          go build -o "$RUNNER_TEMP/echoserver" ./bench/echoserver
          nohup "$RUNNER_TEMP/echoserver" -addr 127.0.0.1:9099 >"$RUNNER_TEMP/echo.log" 2>&1 &
          for _ in $(seq 1 50); do curl -fs http://127.0.0.1:9099/ >/dev/null && exit 0; sleep 0.2; done
          cat "$RUNNER_TEMP/echo.log"; exit 1
      - id: smoke
        uses: ./action
        with:
          scenario: action/testdata/smoke.yaml
          target-url: http://127.0.0.1:9099
          extra-args: -e TARGET_URL=http://127.0.0.1:9099
          version: local
          artifact-name: stampede-action-smoke
      - name: the passing run sets its outputs
        env:
          VERDICT: ${{ steps.smoke.outputs.verdict }}
          P95: ${{ steps.smoke.outputs.p95 }}
          ERRORS: ${{ steps.smoke.outputs.error-rate }}
          DIR: ${{ steps.smoke.outputs.report-dir }}
        run: |
          echo "verdict=$VERDICT p95=$P95 error-rate=$ERRORS"
          test "$VERDICT" = pass
          test -n "$P95" && test "$ERRORS" = 0
          for f in report.html report.json junit.xml summary.md; do test -s "$DIR/$f"; done
      - id: failing
        uses: ./action
        continue-on-error: true
        with:
          scenario: action/testdata/failing.yaml
          extra-args: -e TARGET_URL=http://127.0.0.1:9099
          version: local
          output-dir: stampede-failing
          artifact-name: ""
      - name: a failed target fails the step
        env:
          OUTCOME: ${{ steps.failing.outcome }}
          CODE: ${{ steps.failing.outputs.exit-code }}
          VERDICT: ${{ steps.failing.outputs.verdict }}
        run: |
          echo "outcome=$OUTCOME exit-code=$CODE verdict=$VERDICT"
          test "$OUTCOME" = failure && test "$CODE" = 3 && test "$VERDICT" = fail

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: committed build matches the source
        run: |
          if ! git diff --quiet -- dist || [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error title=web/dist is stale::$(git status --porcelain -- dist | head -20 | tr '\n' ' ')"
            git diff --stat -- dist
            exit 1
          fi

  shoplab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/shoplab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/shoplab/go.mod
      - run: go vet ./...
      - run: go test -race ./...

  packs:
    # A pack is only "shipped" when its journeys work against its reference
    # app; this job proves it on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: start ShopLab
        working-directory: examples/shoplab
        run: docker compose up -d --build --wait
      - run: make build
      - name: dry-run the e-commerce pack against ShopLab
        run: ./bin/stampede pack test ecommerce --target http://localhost:8090

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
