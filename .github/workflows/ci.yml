name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -s -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then echo "needs gofmt -s:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Ubuntu runners restrict the user namespaces Chrome's sandbox needs.
      STAMPEDE_CHROME_NO_SANDBOX: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        shell: bash
        run: |
          set -o pipefail
          if ! go test -race -count=1 -coverprofile=coverage.out ./... 2>&1 | tee test.log; then
            echo "::error title=failing tests::$(grep -E -- '--- FAIL|^FAIL|panic:' test.log | head -15 | tr '\n' ' ')"
            exit 1
          fi
      - name: coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func=coverage.out | tail -1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: make build && ./bin/stampede version
      - name: cross-compile
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/stampede
          done

  accuracy-quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: accuracy (quick)
        run: go run ./bench/accuracy -quick -out accuracy.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accuracy-quick
          path: accuracy.json

  action:
    # The packaged GitHub Action (./action), built from this commit, against
    # a tiny local server: a passing run sets its outputs and a failing
    # target fails the step.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: start the echo server
        run: |
          go build -o "$RUNNER_TEMP/echoserver" ./bench/echoserver
          nohup "$RUNNER_TEMP/echoserver" -addr 127.0.0.1:9099 >"$RUNNER_TEMP/echo.log" 2>&1 &
          for _ in $(seq 1 50); do curl -fs http://127.0.0.1:9099/ >/dev/null && exit 0; sleep 0.2; done
          cat "$RUNNER_TEMP/echo.log"; exit 1
      - id: smoke
        uses: ./action
        with:
          scenario: action/testdata/smoke.yaml
          target-url: http://127.0.0.1:9099
          extra-args: -e TARGET_URL=http://127.0.0.1:9099
          version: local
          artifact-name: stampede-action-smoke
      - name: the passing run sets its outputs
        env:
          VERDICT: ${{ steps.smoke.outputs.verdict }}
          P95: ${{ steps.smoke.outputs.p95 }}
          ERRORS: ${{ steps.smoke.outputs.error-rate }}
          DIR: ${{ steps.smoke.outputs.report-dir }}
        run: |
          echo "verdict=$VERDICT p95=$P95 error-rate=$ERRORS"
          test "$VERDICT" = pass
          test -n "$P95" && test "$ERRORS" = 0
          for f in report.html report.json junit.xml summary.md; do test -s "$DIR/$f"; done
      - id: failing
        uses: ./action
        continue-on-error: true
        with:
          scenario: action/testdata/failing.yaml
          extra-args: -e TARGET_URL=http://127.0.0.1:9099
          version: local
          output-dir: stampede-failing
          artifact-name: ""
      - name: a failed target fails the step
        env:
          OUTCOME: ${{ steps.failing.outcome }}
          CODE: ${{ steps.failing.outputs.exit-code }}
          VERDICT: ${{ steps.failing.outputs.verdict }}
        run: |
          echo "outcome=$OUTCOME exit-code=$CODE verdict=$VERDICT"
          test "$OUTCOME" = failure && test "$CODE" = 3 && test "$VERDICT" = fail

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: committed build matches the source
        run: |
          if ! git diff --quiet -- dist || [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error title=web/dist is stale::$(git status --porcelain -- dist | head -20 | tr '\n' ' ')"
            git diff --stat -- dist
            exit 1
          fi

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  shoplab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/shoplab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/shoplab/go.mod
      - run: go vet ./...
      - run: go test -race ./...

  browser-image:
    # The browser worker image runs a browser scenario end to end.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the browser worker image
        run: docker build -f deploy/docker/Dockerfile.browser-worker -t stampede-browser-worker .
      - name: serve a test page
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cat > "$RUNNER_TEMP/site/index.html" <<'HTML'
          <!doctype html><title>Smoke</title><h1>Smoke</h1>
          <form action="/done.html"><input id="q" name="q"><button>Go</button></form>
          HTML
          echo '<!doctype html><p class="msg">Done</p>' > "$RUNNER_TEMP/site/done.html"
          (cd "$RUNNER_TEMP/site" && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
      - name: run a browser scenario in the image
        run: |
          cat > "$RUNNER_TEMP/smoke.yaml" <<'YAML'
          metadata: {name: browser-smoke}
          target: {baseURL: "http://127.0.0.1:8765"}
          journeys:
            - name: search
              steps:
                - browser: /
                  steps:
                    - fill: {"#q": "boots"}
                    - press: Enter
                    - waitFor: .msg
                    - assert: {".msg": "Done"}
          load: {iterations: 3, vus: 1}
          targets: ["errors < 1%"]
          YAML
          docker run --rm --network host -v "$RUNNER_TEMP:/work:ro" stampede-browser-worker run /work/smoke.yaml

  plugins:
    # Each first-party plugin is its own module: build it, lint it, and
    # run its tests, which include the conformance suite and its example
    # scenario through the engine, against in-process fakes.
    strategy:
      fail-fast: false
      matrix:
        plugin: [udp, redis, mqtt, kafka, sql]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: plugins/${{ matrix.plugin }}/go.mod
          cache-dependency-path: plugins/${{ matrix.plugin }}/go.sum
      - name: gofmt
        run: |
          out=$(gofmt -s -l .)
          if [ -n "$out" ]; then echo "needs gofmt -s:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go build -o /dev/null .
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: plugins/${{ matrix.plugin }}
      - run: go test -race -count=1 ./...

  plugin-sql-databases:
    # The SQL plugin's checks against real PostgreSQL and MySQL servers.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stampede
          POSTGRES_PASSWORD: stampede
          POSTGRES_DB: stampede
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U stampede" --health-interval 2s --health-timeout 5s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: stampede
          MYSQL_DATABASE: stampede
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -pstampede" --health-interval 2s --health-timeout 5s --health-retries 60
    defaults:
      run:
        working-directory: plugins/sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: plugins/sql/go.mod
          cache-dependency-path: plugins/sql/go.sum
      - name: test against PostgreSQL and MySQL
        env:
          STAMPEDE_TEST_POSTGRES_DSN: postgres://stampede:stampede@127.0.0.1:5432/stampede?sslmode=disable
          STAMPEDE_TEST_MYSQL_DSN: root:stampede@tcp(127.0.0.1:3306)/stampede
        run: go test -race -count=1 -run 'TestPostgres|TestMySQL' -v ./...

  packs:
    # A pack is only "shipped" when its journeys work against its reference
    # app; this job proves it on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: start ShopLab
        working-directory: examples/shoplab
        run: docker compose up -d --build --wait
      - run: make build
      - name: dry-run the e-commerce pack against ShopLab
        run: ./bin/stampede pack test ecommerce --target http://localhost:8090

  packlab:
    # The other shipped packs, each against its in-memory PackLab app:
    # stampede init must pick the pack, and every journey must work as
    # shipped (real think times). The same apps run in-process under load
    # in the test job (examples/packlab/packs_test.go).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pack: saas, port: 8091 }
          - { pack: llm-apps, port: 8092 }
          - { pack: chat, port: 8093 }
          - { pack: ticketing, port: 8094 }
          - { pack: identity, port: 8095 }
          - { pack: public-apis, port: 8096 }
          - { pack: fintech, port: 8097 }
          - { pack: social, port: 8098 }
          - { pack: content, port: 8099 }
          - { pack: streaming, port: 8100 }
    runs-on: ubuntu-latest
    env:
      PACK: ${{ matrix.pack }}
      TARGET: http://localhost:${{ matrix.port }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build
      - name: start the reference app
        run: |
          go build -o bin/packlab ./examples/packlab
          ./bin/packlab -product "$PACK" > packlab.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf "$TARGET/healthz" > /dev/null && exit 0; sleep 1; done
          cat packlab.log; exit 1
      - name: stampede init detects the pack
        run: |
          echo n | ./bin/stampede init --target "$TARGET" --dir "$RUNNER_TEMP/init" | tee init.log
          grep -q "Set up the $PACK pack" init.log
      - name: dry-run the pack against its reference app
        run: ./bin/stampede pack test "$PACK" --target "$TARGET"
      - name: reference app log
        if: failure()
        run: cat packlab.log

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
