openapi: 3.0.3
info:
  title: Stampede API
  version: 1.0.0
  description: |
    The public REST API of a Stampede server. The web UI, the CLI and CI
    integrations all use this API.

    Authenticate with a session cookie (from `POST /auth/login`) or an API
    token sent as `Authorization: Bearer stp_...`. Requests that use the
    session cookie and change state must also send `X-Stampede-CSRF: 1`.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /api/v1
security:
  - bearer: []
  - session: []

tags:
  - name: system
  - name: auth
  - name: users
  - name: tokens
  - name: projects
  - name: targets
  - name: secrets
  - name: scenarios
  - name: runs
  - name: schedules
    description: Start runs on a cron schedule. Anyone can read them; editors and above change them.
  - name: workers
  - name: audit
  - name: ai
    description: Optional AI journey generation (bring your own key). Runs before load, never during.
  - name: integrations
    description: Prometheus and trace integrations for server runs, and notification channels. Admin only.

paths:
  /version:
    get:
      tags: [system]
      operationId: getVersion
      security: []
      responses:
        "200":
          description: Server version and setup state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionInfo" }

  /setup:
    post:
      tags: [system]
      operationId: setup
      summary: Create the first organisation and owner account
      description: Only allowed while the server has no users.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "201":
          description: Owner created and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in; sets the session cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooMany" }

  /auth/config:
    get:
      tags: [auth]
      operationId: getAuthConfig
      summary: How people can sign in (public)
      security: []
      responses:
        "200":
          description: The sign-in methods this server offers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        "204": { description: Signed out }

  /me:
    get:
      tags: [auth]
      operationId: getMe
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/password:
    put:
      tags: [auth]
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current, new]
              properties:
                current: { type: string }
                new: { type: string, minLength: 10 }
      responses:
        "204": { description: Changed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Invalid" }

  /users:
    get:
      tags: [users]
      operationId: listUsers
      responses:
        "200":
          description: Members of the organisation
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
    post:
      tags: [users]
      operationId: createUser
      description: Requires admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  /users/{userId}:
    parameters:
      - $ref: "#/components/parameters/userId"
    patch:
      tags: [users]
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [users]
      operationId: deleteUser
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tokens:
    get:
      tags: [tokens]
      operationId: listTokens
      responses:
        "200":
          description: The caller's API tokens (secrets are never returned)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Token" }
    post:
      tags: [tokens]
      operationId: createToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenCreate" }
      responses:
        "201":
          description: Created. The secret is shown only in this response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenCreated" }
        "422": { $ref: "#/components/responses/Invalid" }

  /tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/tokenId"
    delete:
      tags: [tokens]
      operationId: deleteToken
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects:
    get:
      tags: [projects]
      operationId: listProjects
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
    post:
      tags: [projects]
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [projects]
      operationId: getProject
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [projects]
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCreate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [projects]
      operationId: deleteProject
      responses:
        "204": { description: Deleted with everything in it }
        "404": { $ref: "#/components/responses/NotFound" }

  /organisation/caps:
    get:
      tags: [projects]
      operationId: getOrgCaps
      summary: The organisation's hard caps on every run
      responses:
        "200":
          description: Caps; unset fields mean no cap at this level
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Caps" }
    put:
      tags: [projects]
      operationId: putOrgCaps
      summary: Set the organisation's hard caps (admin)
      description: |
        Every run in the organisation must fit within these caps, as well
        as the server's, its project's and its target's. Send an empty
        object to remove them. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Caps" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Caps" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }

  /projects/{projectId}/settings:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [projects]
      operationId: getProjectSettings
      responses:
        "200":
          description: The project's caps and run gate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectSettings" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [projects]
      operationId: putProjectSettings
      summary: Set the project's caps and dry-run gate (admin)
      description: |
        Caps bound every run in the project, together with the server's,
        the organisation's and the target's. With requireDryRun, starting a
        run first runs each journey once with one user; the run fails
        before any load when a journey fails. Needs the admin role in the
        project. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectSettings" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectSettings" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }

  /projects/{projectId}/roles:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [projects]
      operationId: listProjectRoles
      summary: Per-project role overrides
      description: |
        A member's organisation role applies in every project unless an
        override here sets another role for this project, higher or lower.
        Owners are owners everywhere.
      responses:
        "200":
          description: Overrides, by email
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectRole" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{projectId}/roles/{userId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/userId"
    put:
      tags: [projects]
      operationId: putProjectRole
      summary: Give a member a different role in this project (admin)
      description: Needs the admin role in the project. Owners cannot be overridden. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectRoleSet" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectRole" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [projects]
      operationId: deleteProjectRole
      summary: Remove an override, so the organisation role applies again (admin)
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{projectId}/targets:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [targets]
      operationId: listTargets
      responses:
        "200":
          description: Targets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Target" }
    post:
      tags: [targets]
      operationId: createTarget
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Target" }
        "422": { $ref: "#/components/responses/Invalid" }

  /targets/{targetId}:
    parameters:
      - $ref: "#/components/parameters/targetId"
    get:
      tags: [targets]
      operationId: getTarget
      responses:
        "200":
          description: Target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Target" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [targets]
      operationId: updateTarget
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetCreate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Target" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [targets]
      operationId: deleteTarget
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /targets/{targetId}/verify:
    parameters:
      - $ref: "#/components/parameters/targetId"
    post:
      tags: [targets]
      operationId: verifyTarget
      summary: Check the ownership token for a public target
      responses:
        "200":
          description: Verification state after the check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Target" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{projectId}/secrets:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [secrets]
      operationId: listSecrets
      responses:
        "200":
          description: Secret names (values are never returned)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Secret" }
    put:
      tags: [secrets]
      operationId: putSecret
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretPut" }
      responses:
        "200":
          description: Stored, encrypted at rest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "422": { $ref: "#/components/responses/Invalid" }

  /projects/{projectId}/secrets/{name}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - name: name
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [secrets]
      operationId: deleteSecret
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /scenarios/validate:
    post:
      tags: [scenarios]
      operationId: validateScenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [yaml]
              properties:
                yaml: { type: string }
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Validation" }

  /projects/{projectId}/scenarios:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [scenarios]
      operationId: listScenarios
      parameters:
        - name: tag
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Scenarios with their latest version
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Scenario" }
    post:
      tags: [scenarios]
      operationId: createScenario
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScenarioVersionCreate" }
      responses:
        "201":
          description: Created with version 1
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scenario" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  /scenarios/{scenarioId}:
    parameters:
      - $ref: "#/components/parameters/scenarioId"
    get:
      tags: [scenarios]
      operationId: getScenario
      responses:
        "200":
          description: Scenario with its latest version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scenario" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [scenarios]
      operationId: deleteScenario
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /scenarios/{scenarioId}/versions:
    parameters:
      - $ref: "#/components/parameters/scenarioId"
    get:
      tags: [scenarios]
      operationId: listScenarioVersions
      responses:
        "200":
          description: All versions, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScenarioVersion" }
    post:
      tags: [scenarios]
      operationId: createScenarioVersion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScenarioVersionCreate" }
      responses:
        "201":
          description: New version saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScenarioVersion" }
        "422": { $ref: "#/components/responses/Invalid" }

  /scenarios/{scenarioId}/versions/{version}:
    parameters:
      - $ref: "#/components/parameters/scenarioId"
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [scenarios]
      operationId: getScenarioVersion
      responses:
        "200":
          description: The version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScenarioVersion" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{projectId}/runs:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [runs]
      operationId: listRuns
      parameters:
        - name: scenarioId
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: before
          in: query
          description: Return runs created before this time (pagination).
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Runs, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Run" }
    post:
      tags: [runs]
      operationId: createRun
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunCreate" }
      responses:
        "201":
          description: Run accepted and scheduled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  /runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/runId"
    get:
      tags: [runs]
      operationId: getRun
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{runId}/stop:
    parameters:
      - $ref: "#/components/parameters/runId"
    post:
      tags: [runs]
      operationId: stopRun
      summary: Stop gracefully; in-flight iterations may finish
      responses:
        "202": { description: Stopping }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /runs/{runId}/kill:
    parameters:
      - $ref: "#/components/parameters/runId"
    post:
      tags: [runs]
      operationId: killRun
      summary: Kill switch for one run; all load stops immediately
      responses:
        "202": { description: Killed }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/kill-all:
    post:
      tags: [runs]
      operationId: killAllRuns
      summary: Kill switch for every active run in the organisation
      responses:
        "200":
          description: Runs that were killed
          content:
            application/json:
              schema:
                type: object
                required: [killed]
                properties:
                  killed:
                    type: array
                    items: { type: string, format: uuid }

  /runs/{runId}/live:
    parameters:
      - $ref: "#/components/parameters/runId"
    get:
      tags: [runs]
      operationId: streamRun
      summary: Live metrics as server-sent events
      description: |
        Emits `point` events (a timeline Point per interval), `status`
        events when the run changes state, and `event` events for worker
        and safety events. Ends after the run completes.
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{runId}/timeline:
    parameters:
      - $ref: "#/components/parameters/runId"
    get:
      tags: [runs]
      operationId: getRunTimeline
      responses:
        "200":
          description: Per-interval points recorded so far
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Point" }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{runId}/report:
    parameters:
      - $ref: "#/components/parameters/runId"
    get:
      tags: [runs]
      operationId: getRunReport
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, html, junit, markdown, csv, timeline-csv]
            default: json
          description: >
            csv is one row per step, per journey and for the whole run;
            timeline-csv is one row per second. Latencies are in milliseconds.
      responses:
        "200":
          description: The report. JSON follows the `stampede run --json` format.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
            text/html:
              schema: { type: string }
            application/xml:
              schema: { type: string }
            text/markdown:
              schema: { type: string }
            text/csv:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /compare:
    post:
      tags: [runs]
      operationId: compareRuns
      summary: Compare finished runs of version A with runs of version B
      description: |
        The same comparison as `stampede compare`. For p50, p95, p99, error
        rate, throughput and (for breakpoint runs) the highest load that
        held, it gives both means, the relative change, a bootstrap 95%
        confidence interval for the change and the noise floor measured
        between repeats of one version. A change is a regression or an
        improvement only when the interval excludes zero and the change is
        larger than the noise floor. Per-step p95 and error rate are
        compared too but do not affect the verdict. Every run must belong
        to the caller's organisation and have finished with a report.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompareRequest" }
      responses:
        "200":
          description: The comparison
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comparison" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }

  /projects/{projectId}/schedules:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [schedules]
      operationId: listSchedules
      responses:
        "200":
          description: Schedules, by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Schedule" }
    post:
      tags: [schedules]
      operationId: createSchedule
      summary: Create a schedule
      description: |
        The scenario, target and overrides are checked the same way as
        `POST /projects/{projectId}/runs`, so a schedule that is accepted
        would start a run if fired now. Runs start as the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  /schedules/preview:
    get:
      tags: [schedules]
      operationId: previewSchedule
      summary: The next times a cron expression fires
      parameters:
        - name: cron
          in: query
          required: true
          schema: { type: string, example: "0 2 * * *" }
        - name: timezone
          in: query
          description: IANA time zone; defaults to UTC
          schema: { type: string, example: Europe/London }
        - name: count
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 3 }
      responses:
        "200":
          description: Upcoming firings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchedulePreview" }
        "422": { $ref: "#/components/responses/Invalid" }

  /schedules/{scheduleId}:
    parameters:
      - $ref: "#/components/parameters/scheduleId"
    get:
      tags: [schedules]
      operationId: getSchedule
      responses:
        "200":
          description: Schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [schedules]
      operationId: updateSchedule
      summary: Change a schedule, or enable or disable it
      description: |
        Only the fields sent change. The caller becomes the schedule's
        owner, so later runs start as them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [schedules]
      operationId: deleteSchedule
      responses:
        "204": { description: Deleted; runs it started are kept }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /schedules/{scheduleId}/run:
    parameters:
      - $ref: "#/components/parameters/scheduleId"
    post:
      tags: [schedules]
      operationId: runSchedule
      summary: Start the schedule's run now
      description: |
        Starts a run as the caller without changing when the schedule next
        fires. Refused while the schedule's previous run is still active.
      responses:
        "201":
          description: Run accepted and scheduled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  /workers:
    get:
      tags: [workers]
      operationId: listWorkers
      responses:
        "200":
          description: Connected workers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Worker" }

  /audit:
    get:
      tags: [audit]
      operationId: listAudit
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: before
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Audit log, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /ai/providers:
    get:
      tags: [ai]
      operationId: listAIProviders
      summary: AI providers configured for the organisation (keys are never returned)
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AIProvider" }
    post:
      tags: [ai]
      operationId: putAIProvider
      summary: Create or replace an AI provider by name
      description: |
        AI journey generation is optional and bring-your-own-key. The key is
        encrypted with the server's master key and never returned. Omit
        `apiKey` when replacing a provider to keep its stored key. Needs the
        admin role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIProviderPut" }
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIProvider" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIProvider" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  /ai/providers/{providerId}:
    parameters:
      - name: providerId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [ai]
      operationId: deleteAIProvider
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{projectId}/ai/jobs:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [ai]
      operationId: listAIJobs
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Generation jobs, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AIJobSummary" }
    post:
      tags: [ai]
      operationId: createAIJob
      summary: Generate a scenario with an AI model (asynchronous)
      description: |
        Starts a generation job: understand the inputs, draft a scenario,
        check it statically, dry-run each journey once with one user against
        the target, and repair failures (up to `maxRepairs` rounds). Recorded
        traffic is redacted before it reaches the provider. The result is a
        proposal; nothing is saved until `POST /ai/jobs/{jobId}/approve`.
        Refused with 429 when the organisation's AI token use this month
        has reached the provider's cap.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIJobCreate" }
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIJob" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429":
          description: Monthly AI token cap reached, or too many jobs queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /runs/{runId}/narrative:
    parameters:
      - $ref: "#/components/parameters/runId"
    post:
      tags: [ai]
      operationId: createRunNarrative
      summary: Write an AI summary of a finished run's report
      description: |
        Asks the organisation's AI provider for a summary of the report.
        Every claim cites the report figures it rests on and is labelled
        measured or suspected; claims that cite unknown figures, or state
        numbers the cited figures do not contain, are dropped. Only the
        report's aggregate figures are sent, with error messages redacted.
        The narrative is saved into the report, so the HTML and Markdown
        downloads include it, and replaces any earlier one. Refused with
        429 when the organisation's AI token use this month has reached
        the provider's cap.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NarrativeCreate" }
      responses:
        "200":
          description: The narrative, now part of the report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NarrativeResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429":
          description: Monthly AI token cap reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: The AI provider failed or returned nothing usable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /ai/jobs/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [ai]
      operationId: getAIJob
      summary: Job status, stage, token usage, proposal, dry-run traces, problems and diff
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIJob" }
        "404": { $ref: "#/components/responses/NotFound" }

  /ai/jobs/{jobId}/approve:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [ai]
      operationId: approveAIJob
      summary: Save the proposal as a new scenario or a new scenario version
      description: |
        A person approves a finished job by saving its proposal: as a new
        version of `scenarioId` (default: the scenario the job compared
        against), otherwise as a new scenario. Jobs with flagged journeys
        need `allowUnvalidated`. Needs the editor role and is audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIJobApprove" }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIJobApproval" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  /integrations:
    get:
      tags: [integrations]
      operationId: listIntegrations
      summary: Integrations configured for the organisation (tokens are never returned)
      responses:
        "200":
          description: Integrations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Integration" }
    post:
      tags: [integrations]
      operationId: createIntegration
      summary: Add a named Prometheus or traces integration
      description: |
        Scenarios run on the server refer to integrations by name
        (`observe: { prometheus: { integration: <name>, queries: ... } }`),
        so the server only ever contacts URLs an admin configured here.
        A Prometheus bearer token is encrypted with the server's master key
        and never returned. Needs the admin role and is audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  /integrations/{integrationId}:
    parameters:
      - name: integrationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [integrations]
      operationId: deleteIntegration
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /notifications/channels:
    get:
      tags: [integrations]
      operationId: listNotificationChannels
      summary: Notification channels of the organisation (URLs and secrets are never returned)
      responses:
        "200":
          description: Channels
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotificationChannel" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [integrations]
      operationId: createNotificationChannel
      summary: Add a webhook, Slack or Discord channel
      description: |
        The destination URL is encrypted with the server's master key. A
        generic webhook signs each body with HMAC-SHA256 in the
        `X-Stampede-Signature` header; its secret is generated when not
        given and returned only in this response. Destinations on private,
        loopback or link-local addresses are refused unless
        `allowPrivate` is set. Needs the admin role and is audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationChannelCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationChannelCreated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  /notifications/channels/{channelId}:
    parameters:
      - $ref: "#/components/parameters/channelId"
    delete:
      tags: [integrations]
      operationId: deleteNotificationChannel
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /notifications/channels/{channelId}/test:
    parameters:
      - $ref: "#/components/parameters/channelId"
    post:
      tags: [integrations]
      operationId: testNotificationChannel
      summary: Send a test notification now (one attempt, no retries)
      responses:
        "200":
          description: The attempt, also recorded in the delivery log
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationDelivery" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /notifications/channels/{channelId}/deliveries:
    parameters:
      - $ref: "#/components/parameters/channelId"
    get:
      tags: [integrations]
      operationId: listNotificationDeliveries
      summary: The most recent delivery attempts of a channel, newest first
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
      responses:
        "200":
          description: Attempts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotificationDelivery" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: API token, `stp_...`
    session:
      type: apiKey
      in: cookie
      name: stampede_session

  parameters:
    userId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    tokenId:
      name: tokenId
      in: path
      required: true
      schema: { type: string, format: uuid }
    projectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    targetId:
      name: targetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    scenarioId:
      name: scenarioId
      in: path
      required: true
      schema: { type: string, format: uuid }
    runId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    scheduleId:
      name: scheduleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    channelId:
      name: channelId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Not signed in or token invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The caller's role does not allow this
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflicts with the current state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Invalid:
      description: The request is well-formed but invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooMany:
      description: Too many attempts
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: not_found }
            message: { type: string }
            details:
              type: array
              items: { type: string }

    VersionInfo:
      type: object
      required: [version, commit, setupRequired]
      properties:
        version: { type: string }
        commit: { type: string }
        setupRequired: { type: boolean }

    Role:
      type: string
      enum: [owner, admin, editor, runner, viewer]

    SetupRequest:
      type: object
      required: [organisation, name, email, password]
      properties:
        organisation: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, minLength: 10 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    Session:
      type: object
      required: [user, expiresAt]
      properties:
        user: { $ref: "#/components/schemas/Me" }
        expiresAt: { type: string, format: date-time }

    Me:
      type: object
      required: [id, email, name, role, orgId, orgName]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        orgId: { type: string, format: uuid }
        orgName: { type: string }

    User:
      type: object
      required: [id, email, name, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time, nullable: true }

    UserCreate:
      type: object
      required: [email, name, role, password]
      properties:
        email: { type: string, format: email }
        name: { type: string, minLength: 1 }
        role: { $ref: "#/components/schemas/Role" }
        password: { type: string, minLength: 10 }

    Token:
      type: object
      required: [id, name, prefix, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, description: First characters of the token, for recognition }
        role: { $ref: "#/components/schemas/Role" }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }

    TokenCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        role:
          $ref: "#/components/schemas/Role"
        expiresInDays: { type: integer, minimum: 1, maximum: 3650 }

    TokenCreated:
      allOf:
        - $ref: "#/components/schemas/Token"
        - type: object
          required: [secret]
          properties:
            secret: { type: string, description: The full token. Shown once. }

    Project:
      type: object
      required: [id, name, slug, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        role:
          allOf: [{ $ref: "#/components/schemas/Role" }]
          description: The caller's role in this project (the organisation role, or a per-project override)

    ProjectCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 1000 }

    Caps:
      type: object
      properties:
        maxRate: { type: number, format: double, description: Iterations per second }
        maxVUs: { type: integer }
        maxDurationSeconds: { type: integer }

    ProjectSettings:
      type: object
      required: [caps, requireDryRun]
      properties:
        caps: { $ref: "#/components/schemas/Caps" }
        requireDryRun:
          type: boolean
          description: Before load, run each journey once with one user and fail the run if any journey fails.

    ProjectRole:
      type: object
      required: [userId, email, role]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        orgRole: { $ref: "#/components/schemas/Role" }
        createdAt: { type: string, format: date-time }

    ProjectRoleSet:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }

    Target:
      type: object
      required: [id, projectId, name, baseURL, private, verified, verificationToken, caps, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        baseURL: { type: string }
        private:
          type: boolean
          description: Loopback or private network; needs no verification.
        verified: { type: boolean }
        verifiedAt: { type: string, format: date-time, nullable: true }
        verificationMethod: { type: string, nullable: true }
        verificationToken:
          type: string
          description: Publish as a DNS TXT record `stampede-verify=<token>` or at /.well-known/stampede-verify.txt
        allowHosts:
          type: array
          items: { type: string }
        caps: { $ref: "#/components/schemas/Caps" }
        createdAt: { type: string, format: date-time }

    TargetCreate:
      type: object
      required: [name, baseURL]
      properties:
        name: { type: string, minLength: 1 }
        baseURL: { type: string }
        allowHosts:
          type: array
          items: { type: string }
        caps: { $ref: "#/components/schemas/Caps" }

    Secret:
      type: object
      required: [name, updatedAt]
      properties:
        name: { type: string }
        updatedAt: { type: string, format: date-time }

    SecretPut:
      type: object
      required: [name, value]
      properties:
        name: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
        value: { type: string }

    Validation:
      type: object
      required: [valid, problems]
      properties:
        valid: { type: boolean }
        problems:
          type: array
          items: { type: string }
        plan: { $ref: "#/components/schemas/PlanSummary" }

    PlanSummary:
      type: object
      required: [executor, mode, peak, durationSeconds, journeys, steps]
      properties:
        executor: { type: string }
        mode: { type: string }
        shape: { type: string }
        peak: { type: number, format: double }
        durationSeconds: { type: number, format: double }
        journeys: { type: integer }
        steps: { type: integer }

    Scenario:
      type: object
      required: [id, projectId, name, tags, latestVersion, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        tags:
          type: array
          items: { type: string }
        latestVersion: { $ref: "#/components/schemas/ScenarioVersion" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ScenarioVersion:
      type: object
      required: [scenarioId, version, yaml, createdAt]
      properties:
        scenarioId: { type: string, format: uuid }
        version: { type: integer }
        yaml: { type: string }
        message: { type: string }
        createdBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        plan: { $ref: "#/components/schemas/PlanSummary" }

    ScenarioVersionCreate:
      type: object
      required: [yaml]
      properties:
        yaml: { type: string }
        message: { type: string, maxLength: 500 }

    RunStatus:
      type: string
      enum: [scheduling, starting, running, stopping, analyzing, completed, aborted, failed]

    RunOverrides:
      type: object
      properties:
        shape: { type: string }
        mode: { type: string, enum: [vus, rate] }
        vus: { type: integer, minimum: 1 }
        rate: { type: string, example: 100/s }
        duration: { type: string, example: 5m }
        start: { type: string }
        max: { type: string }
        regions:
          type: object
          description: |
            Percent of the load per worker region, such as
            {"mumbai": 50, "frankfurt": 30, "virginia": 20}. The shares add
            up to 100 and replace the scenario's load.regions. A run is
            refused when a region has no connected worker.
          additionalProperties: { type: number, format: double, minimum: 0, maximum: 100 }

    RunCreate:
      type: object
      required: [scenarioId, targetId]
      properties:
        scenarioId: { type: string, format: uuid }
        version: { type: integer, minimum: 1, description: Defaults to the latest }
        targetId: { type: string, format: uuid }
        overrides: { $ref: "#/components/schemas/RunOverrides" }
        env:
          type: object
          additionalProperties: { type: string }
        workers: { type: integer, minimum: 0, description: 0 uses every connected worker }
        note: { type: string, maxLength: 500 }

    Run:
      type: object
      required: [id, projectId, scenarioId, scenarioVersion, targetId, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        scenarioId: { type: string, format: uuid }
        scenarioName: { type: string }
        scenarioVersion: { type: integer }
        targetId: { type: string, format: uuid }
        targetURL: { type: string }
        status: { $ref: "#/components/schemas/RunStatus" }
        verdict:
          type: string
          nullable: true
          enum: [pass, fail, generator-limited, no-targets, null]
        stopReason: { type: string, nullable: true }
        error: { type: string, nullable: true }
        overrides: { $ref: "#/components/schemas/RunOverrides" }
        plan: { $ref: "#/components/schemas/PlanSummary" }
        workers: { type: integer }
        note: { type: string }
        createdBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        endedAt: { type: string, format: date-time, nullable: true }
        summary: { $ref: "#/components/schemas/RunSummary" }

    Schedule:
      type: object
      required: [id, projectId, name, scenarioId, targetId, cron, timezone, enabled, workers, createdAt, updatedAt, lastSkipReason]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        scenarioId: { type: string, format: uuid }
        scenarioName: { type: string }
        targetId: { type: string, format: uuid }
        targetName: { type: string }
        cron: { type: string, example: "0 2 * * *" }
        timezone: { type: string, example: UTC }
        overrides: { $ref: "#/components/schemas/RunOverrides" }
        env:
          type: object
          description: Stored as given and shown to anyone who can read the schedule; use project secrets for sensitive values.
          additionalProperties: { type: string }
        workers: { type: integer }
        enabled: { type: boolean }
        note: { type: string }
        ownerId: { type: string, format: uuid, nullable: true, description: Runs start as this user }
        ownerEmail: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        nextRunAt: { type: string, format: date-time, nullable: true, description: Null while disabled }
        lastFiredAt: { type: string, format: date-time, nullable: true, description: When the schedule last came due or was run by hand }
        lastRunId: { type: string, format: uuid, nullable: true }
        lastRunAt: { type: string, format: date-time, nullable: true }
        lastRunStatus: { $ref: "#/components/schemas/RunStatus" }
        lastRunVerdict: { type: string, nullable: true, description: "pass, fail, generator-limited or no-targets, once the last run has finished" }
        lastSkipReason: { type: string, description: Why the last firing started no run; empty when it did }

    ScheduleCreate:
      type: object
      required: [name, scenarioId, targetId, cron]
      properties:
        name: { type: string, maxLength: 100 }
        scenarioId: { type: string, format: uuid }
        targetId: { type: string, format: uuid }
        cron: { type: string, description: Five fields (minute hour day-of-month month day-of-week) or a macro such as @daily }
        timezone: { type: string, description: IANA time zone; defaults to UTC }
        overrides: { $ref: "#/components/schemas/RunOverrides" }
        env:
          type: object
          additionalProperties: { type: string }
        workers: { type: integer, minimum: 0, description: 0 uses every connected worker }
        enabled: { type: boolean, default: true }
        note: { type: string, maxLength: 500 }

    ScheduleUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        scenarioId: { type: string, format: uuid }
        targetId: { type: string, format: uuid }
        cron: { type: string }
        timezone: { type: string }
        overrides: { $ref: "#/components/schemas/RunOverrides" }
        env:
          type: object
          additionalProperties: { type: string }
        workers: { type: integer, minimum: 0 }
        enabled: { type: boolean }
        note: { type: string, maxLength: 500 }

    SchedulePreview:
      type: object
      required: [timezone, next]
      properties:
        timezone: { type: string }
        next:
          type: array
          items: { type: string, format: date-time }

    RunSummary:
      type: object
      nullable: true
      properties:
        requests: { type: integer }
        errorRate: { type: number, format: double }
        rps: { type: number, format: double }
        p95: { type: number, format: double, description: seconds }
        p99: { type: number, format: double, description: seconds }

    Point:
      type: object
      required: [t, rps, errorRate, p50, p95, p99, vus, planned, dropped]
      properties:
        t: { type: number, format: double, description: Seconds since start }
        rps: { type: number, format: double }
        errorRate: { type: number, format: double }
        p50: { type: number, format: double }
        p95: { type: number, format: double }
        p99: { type: number, format: double }
        vus: { type: integer }
        planned: { type: number, format: double }
        dropped: { type: integer }
        iterations: { type: integer }
        schedLagP99: { type: number, format: double }

    Report:
      type: object
      description: The full report; same format as `stampede run --json`.
      additionalProperties: true

    CompareRequest:
      type: object
      required: [a, b]
      properties:
        a:
          type: array
          description: Runs of the baseline version
          minItems: 1
          maxItems: 20
          items: { type: string, format: uuid }
        b:
          type: array
          description: Runs of the new version
          minItems: 1
          maxItems: 20
          items: { type: string, format: uuid }
        labelA: { type: string, maxLength: 100, description: Name for the baseline (default A) }
        labelB: { type: string, maxLength: 100, description: Name for the new version (default B) }

    CompareVerdict:
      type: string
      enum: [regression, improvement, no-change, inconclusive]
      x-enum-varnames: [CompareRegression, CompareImprovement, CompareNoChange, CompareInconclusive]

    CompareSide:
      type: object
      required: [label, runs]
      properties:
        label: { type: string }
        runs:
          type: array
          items: { type: string }

    MetricDelta:
      type: object
      required: [name, higherIsBetter, a, b, meanA, meanB, change, ciLow, ciHigh, noiseFloor, verdict]
      properties:
        name: { type: string, description: "p50, p95, p99, error rate, throughput or max sustainable load" }
        higherIsBetter: { type: boolean }
        a:
          type: array
          description: The value from each run of A. Latencies are in seconds, error rates are fractions.
          items: { type: number, format: double }
        b:
          type: array
          items: { type: number, format: double }
        meanA: { type: number, format: double }
        meanB: { type: number, format: double }
        change:
          type: number
          format: double
          nullable: true
          description: (meanB - meanA) / meanA; null when meanA is 0 and meanB is not.
        ciLow: { type: number, format: double, nullable: true, description: Lower bound of the 95% interval of the change }
        ciHigh: { type: number, format: double, nullable: true, description: Upper bound of the 95% interval of the change }
        noiseFloor: { type: number, format: double, description: Largest relative spread between repeats of one version (at least 0.02) }
        verdict: { $ref: "#/components/schemas/CompareVerdict" }

    StepDelta:
      type: object
      required: [journey, step, metrics]
      properties:
        journey: { type: string }
        step: { type: string }
        metrics:
          type: array
          description: p95 and error rate
          items: { $ref: "#/components/schemas/MetricDelta" }

    Comparison:
      type: object
      required: [a, b, comparable, problems, metrics, steps, verdict, confidence, markdown]
      properties:
        a: { $ref: "#/components/schemas/CompareSide" }
        b: { $ref: "#/components/schemas/CompareSide" }
        comparable: { type: boolean, description: False when the runs differ in scenario, load plan, duration or worker count, or a run was generator-limited }
        problems:
          type: array
          description: Why the runs are not comparable
          items: { type: string }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/MetricDelta" }
        steps:
          type: array
          description: Per-step comparisons; informational, they do not change the verdict
          items: { $ref: "#/components/schemas/StepDelta" }
        verdict: { $ref: "#/components/schemas/CompareVerdict" }
        confidence: { type: number, format: double, description: Confidence level of the intervals (0.95) }
        markdown: { type: string, description: The comparison as Markdown, as `stampede compare --md` writes it }

    Worker:
      type: object
      required: [id, name, region, connectedAt, lastSeenAt, status]
      properties:
        id: { type: string }
        name: { type: string }
        region: { type: string }
        version: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        cpus: { type: integer }
        memoryBytes: { type: integer }
        protocols:
          type: array
          items: { type: string }
          description: Drivers the worker supports, such as http, grpc or browser.
        plugins:
          type: array
          items: { type: string }
          description: Plugins installed on the worker, such as mqtt or kafka.
        status: { type: string, enum: [idle, busy, saturated, lost] }
        runId: { type: string, nullable: true }
        connectedAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }

    AuditEntry:
      type: object
      required: [id, at, action, actor]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor: { type: string, description: User email or token name }
        action: { type: string, example: run.start }
        subject: { type: string }
        details:
          type: object
          additionalProperties: true
        ip: { type: string }

    AIProviderKind:
      type: string
      enum: [anthropic, openai, gemini, ollama, openai-compatible]
      x-enum-varnames: [AIProviderAnthropic, AIProviderOpenAI, AIProviderGemini, AIProviderOllama, AIProviderOpenAICompatible]

    AIProvider:
      type: object
      required: [id, name, kind, model, hasKey, monthlyTokenCap, usedTokensThisMonth, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: "#/components/schemas/AIProviderKind" }
        model: { type: string }
        baseURL: { type: string }
        hasKey: { type: boolean, description: Whether an API key is stored. The key itself is never returned. }
        monthlyTokenCap:
          type: integer
          format: int64
          description: Jobs are refused once the organisation's AI token use this calendar month (UTC) reaches this cap.
        usedTokensThisMonth: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AIProviderPut:
      type: object
      required: [kind]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, default: default }
        kind: { $ref: "#/components/schemas/AIProviderKind" }
        model: { type: string, description: Required except for anthropic (default claude-sonnet-5-5). }
        baseURL: { type: string, description: API base URL; required for openai-compatible. }
        apiKey: { type: string, description: Stored encrypted; omit to keep the current key. }
        monthlyTokenCap: { type: integer, format: int64, minimum: 1, description: Default 2000000. }

    AIJobCreate:
      type: object
      properties:
        providerId: { type: string, format: uuid, description: Defaults to the organisation's only provider, or the one named "default". }
        description: { type: string, maxLength: 20000 }
        openapi: { type: string, description: OpenAPI 3.x document (YAML or JSON) }
        har: { type: string, description: HAR recording (JSON) }
        accessLog: { type: string, description: Web server access log }
        targetId: { type: string, format: uuid, description: Required for the dry run. }
        scenarioId: { type: string, format: uuid, description: Existing scenario to compare the proposal with. }
        dryRun: { type: boolean, default: true }
        maxRepairs: { type: integer, minimum: 0, maximum: 3, default: 3 }

    AIUsage:
      type: object
      required: [inputTokens, outputTokens]
      properties:
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }

    AuthConfig:
      type: object
      required: [password]
      properties:
        password: { type: boolean, description: Email and password sign-in is available. }
        sso:
          type: object
          required: [name, loginURL]
          description: Set when single sign-on is configured.
          properties:
            name: { type: string, description: Label for the sign-in button. }
            loginURL: { type: string, description: "Start sign-in here (a browser navigation, not a fetch); add ?next=/path to return there." }

    NarrativeCreate:
      type: object
      properties:
        providerId:
          type: string
          format: uuid
          description: Provider to use; default the only one, or the one named "default".

    NarrativeResult:
      type: object
      required: [narrative, usage]
      properties:
        narrative: { $ref: "#/components/schemas/Narrative" }
        usage: { $ref: "#/components/schemas/AIUsage" }

    Narrative:
      type: object
      required: [summary, claims]
      properties:
        summary: { type: string }
        model: { type: string }
        claims:
          type: array
          items: { $ref: "#/components/schemas/NarrativeClaim" }
        facts:
          type: array
          description: The report figures the claims cite.
          items: { $ref: "#/components/schemas/NarrativeFact" }

    NarrativeClaim:
      type: object
      required: [text, label, refs]
      properties:
        text: { type: string }
        label: { type: string, enum: [measured, suspected] }
        refs:
          type: array
          items: { type: string }
          description: Ids of the facts the claim rests on.

    NarrativeFact:
      type: object
      required: [id, text, where]
      properties:
        id: { type: string }
        text: { type: string }
        where: { type: string, description: The report section that shows it. }

    AIJobStatus:
      type: string
      enum: [queued, running, succeeded, needs_review, failed]
      x-enum-varnames: [AIJobQueued, AIJobRunning, AIJobSucceeded, AIJobNeedsReview, AIJobFailed]
      description: succeeded means every journey passed its dry run; needs_review means some journeys are flagged.

    AIProblem:
      type: object
      required: [message]
      properties:
        journey: { type: string }
        message: { type: string }
        fatal: { type: boolean, description: The proposal cannot be used while this problem remains. }

    AICheck:
      type: object
      required: [name, ok]
      properties:
        name: { type: string }
        ok: { type: boolean }
        detail: { type: string }

    AIStepTrace:
      type: object
      required: [step, ok, durationMs]
      description: One request of a dry run. Bodies are truncated; secrets and personal data are redacted.
      properties:
        step: { type: string }
        method: { type: string }
        url: { type: string }
        requestHeaders:
          type: object
          additionalProperties: { type: string }
        requestBody: { type: string }
        status: { type: integer }
        responseHeaders:
          type: object
          additionalProperties: { type: string }
        responseBody: { type: string }
        durationMs: { type: number, format: double }
        extracted:
          type: object
          additionalProperties: { type: string }
        checks:
          type: array
          items: { $ref: "#/components/schemas/AICheck" }
        ok: { type: boolean }
        error: { type: string }
        note: { type: string }

    AITrace:
      type: object
      required: [pass, ok, steps]
      properties:
        pass: { type: integer }
        branches:
          type: array
          items: { type: string }
        ok: { type: boolean }
        error: { type: string }
        steps:
          type: array
          items: { $ref: "#/components/schemas/AIStepTrace" }

    AIJourney:
      type: object
      required: [name, status, attempts, traces]
      properties:
        name: { type: string }
        status:
          type: string
          enum: [passed, flagged, not-run]
          x-enum-varnames: [AIJourneyPassed, AIJourneyFlagged, AIJourneyNotRun]
        attempts: { type: integer, description: Dry runs of this journey across repair rounds }
        problems:
          type: array
          items: { type: string }
        traces:
          type: array
          items: { $ref: "#/components/schemas/AITrace" }

    AIJobSummary:
      type: object
      required: [id, projectId, status, stage, providerKind, model, usage, dryRun, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/AIJobStatus" }
        stage: { type: string, description: "understand, draft, static-check, dry-run, repair or done" }
        providerKind: { type: string }
        model: { type: string }
        usage: { $ref: "#/components/schemas/AIUsage" }
        dryRun: { type: boolean }
        error: { type: string }
        createdBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }

    AIJob:
      allOf:
        - $ref: "#/components/schemas/AIJobSummary"
        - type: object
          required: [round, journeys, problems]
          properties:
            round: { type: integer, description: Repair round (0 is the first draft) }
            targetId: { type: string, format: uuid, nullable: true }
            scenarioId: { type: string, format: uuid, nullable: true }
            yaml: { type: string, description: The proposed scenario }
            diff: { type: string, description: Unified diff against scenarioId's latest version }
            problems:
              type: array
              items: { $ref: "#/components/schemas/AIProblem" }
            journeys:
              type: array
              items: { $ref: "#/components/schemas/AIJourney" }
            startedAt: { type: string, format: date-time, nullable: true }
            approvedScenarioId: { type: string, format: uuid, nullable: true }
            approvedVersion: { type: integer, nullable: true }

    AIJobApprove:
      type: object
      properties:
        scenarioId: { type: string, format: uuid, description: Save as a new version of this scenario }
        message: { type: string, maxLength: 500 }
        allowUnvalidated: { type: boolean, default: false, description: Approve even though some journeys are flagged }

    AIJobApproval:
      type: object
      required: [scenario, version]
      properties:
        scenario: { $ref: "#/components/schemas/Scenario" }
        version: { type: integer }

    IntegrationKind:
      type: string
      enum: [prometheus, traces, agent]
      x-enum-varnames: [IntegrationPrometheus, IntegrationTraces, IntegrationAgent]

    Integration:
      type: object
      required: [id, name, kind, url, hasToken, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: "#/components/schemas/IntegrationKind" }
        url:
          type: string
          description: Prometheus base URL, for traces a link template containing {traceId}, or a stampede agent's control API.
        hasToken: { type: boolean, description: Whether a bearer token is stored. The token itself is never returned. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    IntegrationCreate:
      type: object
      required: [name, kind, url]
      properties:
        name: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$" }
        kind: { $ref: "#/components/schemas/IntegrationKind" }
        url:
          type: string
          description: |
            prometheus: the base URL, e.g. http://prometheus:9090. traces: a link
            template containing {traceId}, e.g. https://jaeger.example.com/trace/{traceId}.
            agent: a stampede agent's control API, e.g. http://agent.shop.svc:7070.
        bearerToken: { type: string, description: "Prometheus (optional) and agent (required). Stored encrypted." }

    NotificationKind:
      type: string
      enum: [webhook, slack, discord]
      x-enum-varnames: [NotificationWebhook, NotificationSlack, NotificationDiscord]

    NotificationEvent:
      type: string
      enum: [run.finished, run.target_failed, run.killed]
      x-enum-varnames: [EventRunFinished, EventRunTargetFailed, EventRunKilled]

    NotificationChannel:
      type: object
      required: [id, name, kind, events, allowPrivate, urlHint, hasSecret, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: "#/components/schemas/NotificationKind" }
        events:
          type: array
          items: { $ref: "#/components/schemas/NotificationEvent" }
        allowPrivate: { type: boolean, description: "Deliveries may reach private, loopback and link-local addresses." }
        urlHint: { type: string, description: "The destination's scheme and host only, e.g. https://hooks.slack.com" }
        hasSecret: { type: boolean, description: Whether bodies are signed (generic webhooks). }
        createdAt: { type: string, format: date-time }
        lastDelivery: { $ref: "#/components/schemas/NotificationDelivery" }

    NotificationChannelCreate:
      type: object
      required: [name, kind, url]
      properties:
        name: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$" }
        kind: { $ref: "#/components/schemas/NotificationKind" }
        url: { type: string, description: Webhook URL. Stored encrypted and never returned. }
        events:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/NotificationEvent" }
          description: Default all events.
        allowPrivate: { type: boolean, default: false }
        secret:
          type: string
          minLength: 16
          description: Webhook signing secret. Generated when omitted; ignored for Slack and Discord.

    NotificationChannelCreated:
      type: object
      required: [channel]
      properties:
        channel: { $ref: "#/components/schemas/NotificationChannel" }
        secret: { type: string, description: The webhook signing secret. Shown only once. }

    NotificationDelivery:
      type: object
      required: [id, deliveryId, event, attempt, ok, statusCode, error, durationMs, at]
      properties:
        id: { type: integer, format: int64 }
        deliveryId: { type: string, format: uuid, description: Same for every attempt of one delivery (X-Stampede-Delivery). }
        event: { type: string, example: run.finished }
        runId: { type: string, format: uuid, nullable: true }
        attempt: { type: integer }
        ok: { type: boolean }
        statusCode: { type: integer, description: "HTTP status; 0 when no response was received." }
        error: { type: string }
        durationMs: { type: integer }
        at: { type: string, format: date-time }
