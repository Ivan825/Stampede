apiVersion: stampede.dev/v1
kind: Scenario
metadata:
  name: llm-chat-stream
  description: Time to first token and tokens per second of a streaming chat API.
target:
  baseURL: ${env.TARGET_URL}
  headers:
    Authorization: Bearer ${secret.API_KEY}
journeys:
  - name: chat
    steps:
      - name: completion
        sse: /v1/chat/completions
        json:
          model: small
          stream: true
          messages: [{ role: user, content: "Summarise order ${rand(1, 1000)}" }]
        until: { match: '^\[DONE\]$', duration: 60s }
        check: { status: 200 }
      - name: notifications
        sse: /events
        method: GET
        query: { topic: orders }
        until: { events: 10, duration: 30s }
        extract: { lastOrder: "$.orderId" }
      - get: /api/orders/${lastOrder}
load: { mode: rate, rate: 5/s, duration: 2m }
targets:
  - chat/completion.p95 < 20s
