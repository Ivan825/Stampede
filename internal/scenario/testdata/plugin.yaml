apiVersion: stampede.dev/v1
kind: Scenario
metadata:
  name: telemetry
target:
  baseURL: ${env.TARGET_URL}
vars:
  broker: tcp://broker.internal:1883
journeys:
  - name: device
    steps:
      - name: connect
        plugin: mqtt.connect
        with: { broker: "${broker}", clientId: "device-${vu}", cleanSession: true }
      - loop: 10
        steps:
          - name: publish reading
            plugin: mqtt.publish
            with:
              topic: devices/${vu}/telemetry
              payload: '{"temp": ${rand(15, 30)}}'
              qos: 1
            check: { maxLatency: 200ms, json: { "$.packetId": exists } }
            extract: { packetId: "$.packetId" }
            timeout: 5s
          - think: 1s
      - name: lookup
        plugin: redis.command
        with: { addr: "cache:6379", command: [GET, "device:${vu}:${packetId}"] }
        check: { expr: "json.value != null" }
      - plugin: udp.send
load: { vus: 100, duration: 1m }
targets:
  - device/publish reading.p95 < 50ms
