apiVersion: stampede.dev/v1
kind: Scenario
metadata:
  name: chat-websocket
target:
  baseURL: ${env.TARGET_URL}
journeys:
  - name: chat
    steps:
      - post: /api/login
        json: { user: "user-${vu}" }
        extract: { token: "$.token" }
      - name: connect
        ws: /ws/chat
        headers: { Authorization: "Bearer ${token}" }
        subprotocols: [chat.v1]
        timeout: 5s
        steps:
          - name: welcome
            expect: { json: { "$.type": welcome, "$.room": exists } }
            extract: { room: "$.room" }
          - send: { type: join, room: "${room}" }
          - loop: 10
            steps:
              - name: say
                send: '{"type":"say","text":"hello ${iter}"}'
              - name: echo
                expect: { match: '"type":"said"', timeout: 2s }
              - think: 500ms..2s
          - expect: pong
      - get: /api/rooms/${room}
load: { vus: 200, duration: 2m }
targets:
  - chat/echo.p95 < 100ms
  - chat/connect.p99 < 1s
