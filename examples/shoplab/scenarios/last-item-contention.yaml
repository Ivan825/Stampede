# Many buyers race for products 1-10, which have only 5 units each.
# Reset stock first:  curl -X POST localhost:8090/admin/stock/reset
# A 409 is the correct answer once stock runs out. Afterwards check
#   curl localhost:8090/admin/oversold
# Without SHOPLAB_FIX_RACE=1 it reports units sold beyond stock.
apiVersion: stampede.dev/v1
kind: Scenario
metadata:
  name: shoplab-last-item
  tags: [shoplab, contention, correctness]
target:
  baseURL: ${env.TARGET_URL}
data:
  users: { csv: ../data/users.csv, mode: unique, onExhausted: wrap }
journeys:
  - name: buy-scarce-item
    steps:
      - post: /api/login
        json: { email: "${data.users.email}", password: "${data.users.password}" }
        check: { status: 200 }
        extract: { token: "$.token" }
      - post: /api/cart
        headers: { Authorization: "Bearer ${token}" }
        json: { productId: "${rand(1, 10)}", qty: 1 }
        check: { status: 200 }
      - post: /api/checkout
        headers: { Authorization: "Bearer ${token}" }
        check: { status: [201, 409] }
load:
  mode: vus
  vus: 60
  iterations: 300
