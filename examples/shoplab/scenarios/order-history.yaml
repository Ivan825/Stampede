# Logged-in users reading their order history. Without the
# (user_id, created_at) index every call scans the orders table; reseed with
# --orders-per-user 200 to make it obvious.
apiVersion: stampede.dev/v1
kind: Scenario
metadata:
  name: shoplab-order-history
  tags: [shoplab, data-growth]
target:
  baseURL: ${env.TARGET_URL}
data:
  users: { csv: ../data/users.csv, mode: sequential }
journeys:
  - name: orders
    steps:
      - post: /api/login
        json: { email: "${data.users.email}", password: "${data.users.password}" }
        check: { status: 200 }
        extract: { token: "$.token" }
      - loop: 3
        steps:
          - get: /api/orders?page=${rand(1, 3)}
            headers: { Authorization: "Bearer ${token}" }
            check: { status: 200 }
load:
  mode: rate
  rate: 30/s
  duration: 1m
targets:
  - orders.p95 < 200ms
