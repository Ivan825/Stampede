# A spike on popular product pages straight after the cache is emptied.
# Flush first:  curl -X POST localhost:8090/admin/cache/flush
# Without the fix every concurrent request recomputes the expensive review
# summary; with SHOPLAB_FIX_CACHE=1 one request per product does.
apiVersion: stampede.dev/v1
kind: Scenario
metadata:
  name: shoplab-cold-cache
  tags: [shoplab, spike, cache]
target:
  baseURL: ${env.TARGET_URL}
journeys:
  - name: product-detail
    steps:
      - get: /api/products/${rand(1, 100)}
        check: { status: 200 }
load:
  shape: spike
  mode: rate
  start: 20/s
  max: 400/s
  duration: 1m
targets:
  - http.p99 < 500ms
