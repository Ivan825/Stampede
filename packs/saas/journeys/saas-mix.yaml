# The everyday mix for a B2B app: users across many tenants sign in, open
# their dashboard (GraphQL, sent as persisted queries), work through
# records over REST, edit through GraphQL mutations, and run reports.
apiVersion: stampede.dev/v1
kind: Scenario
metadata:
  name: saas-mix
  description: Weighted dashboard, record-editing and report journeys across many tenants, over REST and GraphQL.
  tags: [pack:saas]
target:
  baseURL: ${env.TARGET_URL}
data:
  users: { csv: ../data/users.csv, mode: random }
journeys:
  - name: dashboard
    weight: 40
    steps:
      - name: sign in
        post: /api/login
        json: { email: "${data.users.email}", password: "${data.users.password}" }
        check: { status: 200 }
        extract: { token: "$.token" }
      - name: dashboard
        graphql: /graphql
        headers: { Authorization: "Bearer ${token}" }
        operationName: Dashboard
        persisted: true
        query: |
          query Dashboard {
            dashboard {
              tenant
              openRecords
              wonAmount
              recent(limit: 10) { id title status amount owner { name } }
            }
          }
        check: { json: { "$.data.dashboard.tenant": exists } }
        extract: { recordId: "$.data.dashboard.recent[0].id" }
      - think: 3s..8s
      - name: record
        graphql: /graphql
        headers: { Authorization: "Bearer ${token}" }
        operationName: Record
        persisted: true
        query: |
          query Record($id: ID!) { record(id: $id) { id title status amount updated owner { name email } } }
        variables: { id: "${recordId}" }
        check: { json: { "$.data.record.id": exists } }
  - name: records
    weight: 30
    steps:
      - name: sign in
        post: /api/login
        json: { email: "${data.users.email}", password: "${data.users.password}" }
        check: { status: 200 }
        extract: { token: "$.token" }
      - name: list
        get: /api/records?page=${rand(1, 5)}&limit=20&status=open
        headers: { Authorization: "Bearer ${token}" }
        check: { status: 200, json: { "$.records[0].id": exists } }
        extract: { recordId: "$.records[0].id" }
      - think: 2s..5s
      - name: open record
        get: /api/records/${recordId}
        headers: { Authorization: "Bearer ${token}" }
        check: { status: 200 }
      - think: 3s..10s
      - name: edit record
        patch: /api/records/${recordId}
        headers: { Authorization: "Bearer ${token}" }
        json: { amount: "${rand(100, 50000)}" }
        check: { status: 200 }
      - name: create record
        post: /api/records
        headers: { Authorization: "Bearer ${token}" }
        json: { title: "New deal ${randString(6)}", status: open, amount: 1500 }
        check: { status: 201, json: { "$.id": exists } }
  - name: graphql-edit
    weight: 10
    steps:
      - name: sign in
        post: /api/login
        json: { email: "${data.users.email}", password: "${data.users.password}" }
        check: { status: 200 }
        extract: { token: "$.token" }
      - name: create
        graphql: /graphql
        headers: { Authorization: "Bearer ${token}" }
        query: |
          mutation Create($title: String!) { createRecord(title: $title, amount: 2500) { id status } }
        variables: { title: "Lead ${randString(6)}" }
        check: { json: { "$.data.createRecord.status": open } }
        extract: { recordId: "$.data.createRecord.id" }
      - think: 2s..5s
      - name: win
        graphql: /graphql
        headers: { Authorization: "Bearer ${token}" }
        query: |
          mutation Win($id: ID!) { updateRecord(id: $id, status: "won") { id status } }
        variables: { id: "${recordId}" }
        check: { json: { "$.data.updateRecord.status": won } }
  - name: reports
    weight: 20
    steps:
      - name: sign in
        post: /api/login
        json: { email: "${data.users.email}", password: "${data.users.password}" }
        check: { status: 200 }
        extract: { token: "$.token" }
      - name: pipeline
        get: /api/reports/pipeline
        headers: { Authorization: "Bearer ${token}" }
        check: { status: 200, json: { "$.rows[0].key": exists } }
      - think: 5s..10s
      - name: revenue
        get: /api/reports/revenue-by-month
        headers: { Authorization: "Bearer ${token}" }
        check: { status: 200 }
load:
  mode: rate
  rate: 10/s
  duration: 5m
targets:
  - http.p95 < 500ms
  - errors < 1%
  - "dashboard/dashboard.p95 < 300ms"
  - "reports.p95 < 2s"
