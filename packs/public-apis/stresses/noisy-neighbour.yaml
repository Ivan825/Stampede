# A misbehaving client hammers the API and ignores its 429s while everyone
# else behaves. Rate limiting should contain the noisy key: the
# well-behaved journeys' latency and error targets must hold.
apiVersion: stampede.dev/v1
kind: Scenario
metadata:
  name: public-api-noisy-neighbour
  tags: [pack:public-apis, contention]
target:
  baseURL: ${env.TARGET_URL}
vars:
  noisyKey: sk_test_free
data:
  keys: { csv: ../data/api-keys.csv, mode: random }
journeys:
  - name: noisy-client
    weight: 3
    steps:
      - loop: 20
        steps:
          - name: flood
            get: /v1/items?limit=100
            headers: { X-API-Key: "${vars.noisyKey}" }
            check: { status: [200, 429] }
  - name: well-behaved
    weight: 7
    target: { p95: 200ms, errors: 0.1% }
    steps:
      - get: /v1/items/${rand(1, 10000)}
        headers: { X-API-Key: "${data.keys.key}" }
        check: { status: 200 }
      - think: 500ms..1s
      - get: /v1/items?limit=20
        headers: { X-API-Key: "${data.keys.key}" }
        check: { status: 200 }
load:
  mode: rate
  rate: 20/s
  duration: 3m
targets:
  - well-behaved.p95 < 200ms
  - well-behaved.errors < 0.1%
