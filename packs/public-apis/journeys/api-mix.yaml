# The everyday mix for a public API: each iteration is one of 500
# integrations, each with its own key. Most traffic pages through lists and reads
# single records; some creates records (retrying with the same idempotency
# key, as a client does after a timeout), checks usage, or waits for a
# webhook delivery.
apiVersion: stampede.dev/v1
kind: Scenario
metadata:
  name: public-api-mix
  description: Weighted list, read, idempotent create, usage and webhook journeys across 500 API keys.
  tags: [pack:public-apis]
target:
  baseURL: ${env.TARGET_URL}
data:
  keys: { csv: ../data/api-keys.csv, mode: random }
journeys:
  - name: list
    weight: 45
    steps:
      - name: first page
        get: /v1/items?limit=20
        headers: { X-API-Key: "${data.keys.key}" }
        check: { status: 200, json: { "$.data[0].id": exists } }
        extract: { cursor: "$.next_cursor" }
      - think: 1s..2s
      - name: next page
        get: /v1/items?limit=20&cursor=${cursor}
        headers: { X-API-Key: "${data.keys.key}" }
        check: { status: 200 }
  - name: read
    weight: 25
    steps:
      - get: /v1/items/${rand(1, 10000)}
        headers: { X-API-Key: "${data.keys.key}" }
        check: { status: 200, json: { "$.id": exists } }
  - name: create
    weight: 10
    steps:
      - name: create
        post: /v1/items
        headers: { X-API-Key: "${data.keys.key}", Idempotency-Key: "${uuid()}" }
        json: { name: "load test ${randString(8)}", price: 9.99 }
        check: { status: 201 }
        extract: { itemId: "$.id", idemKey: "header:Idempotency-Key" }
      - name: retry create
        post: /v1/items
        headers: { X-API-Key: "${data.keys.key}", Idempotency-Key: "${idemKey}" }
        json: { name: "load test retry", price: 9.99 }
        # The retry must return the first item, not create a second one.
        check: { status: 201, expr: "headers['idempotent-replayed'] == 'true'" }
      - get: /v1/items/${itemId}
        headers: { X-API-Key: "${data.keys.key}" }
        check: { status: 200 }
  - name: usage
    weight: 10
    steps:
      - get: /v1/usage
        headers: { X-API-Key: "${data.keys.key}" }
        check: { status: 200, json: { "$.plan": exists } }
  - name: webhook
    weight: 10
    steps:
      - name: send test event
        post: /v1/webhooks/test
        headers: { X-API-Key: "${data.keys.key}" }
        check: { status: 202 }
        extract: { deliveryId: "$.id", state: "$.status" }
      - while: "${state != 'delivered'}"
        max: 50
        steps:
          - think: 200ms
          - name: poll delivery
            get: /v1/deliveries/${deliveryId}
            headers: { X-API-Key: "${data.keys.key}" }
            check: { status: 200 }
            extract: { state: "$.status" }
      - name: delivered
        get: /v1/deliveries/${deliveryId}
        headers: { X-API-Key: "${data.keys.key}" }
        check: { status: 200, json: { "$.status": delivered } }
load:
  mode: rate
  rate: 20/s
  duration: 5m
targets:
  - http.p95 < 300ms
  - errors < 1%
  - webhook.p95 < 5s
