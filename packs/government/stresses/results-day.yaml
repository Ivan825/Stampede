# Results day: the results go live at a published time and arrivals jump
# eightyfold within minutes, nearly everyone looking up one result and
# downloading the marksheet, many refreshing the notices first. The
# lookup must stay quick at the peak; a portal that falls over here makes
# the news.
apiVersion: stampede.dev/v1
kind: Scenario
metadata:
  name: government-results-day
  tags: [pack:government, spike]
target:
  baseURL: ${env.TARGET_URL}
data:
  candidates: { csv: ../data/candidates.csv, mode: random }
journeys:
  - name: student
    weight: 8
    steps:
      - name: notices
        get: /api/notices
        check: { status: 200 }
      - name: lookup
        post: /api/results/lookup
        json: { rollNumber: "${data.candidates.rollNumber}", dateOfBirth: "${data.candidates.dateOfBirth}" }
        check: { status: 200 }
      - think: 3s..10s
      - name: marksheet
        get: /api/results/${data.candidates.rollNumber}/marksheet?dob=${data.candidates.dateOfBirth}
        check: { status: 200 }
  - name: refresher
    weight: 2
    steps:
      - name: results status
        get: /api/results/status
        check: { status: 200 }
      - name: notices
        get: /api/notices
        check: { status: 200 }
load:
  shape: spike
  mode: rate
  start: 5/s
  max: 400/s
  duration: 5m
targets:
  - "student/lookup.p95 < 500ms"
  - "student/marksheet.p95 < 1s"
  - errors < 1%
