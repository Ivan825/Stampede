# A game server full of players, each sending 10 to 20 inputs a second for
# a whole match. The input round trip includes waiting for the server's
# next tick; it should stay within about one tick however many players
# are in, and no input should go unanswered.
apiVersion: stampede.dev/v1
kind: Scenario
metadata:
  name: gaming-full-server
  tags: [pack:gaming, soak]
target:
  baseURL: ${env.TARGET_URL}
journeys:
  - name: player
    steps:
      - name: sign in
        post: /api/login
        json: { player: "player-${vu}" }
        check: { status: 200 }
        extract: { token: "$.token" }
      - name: matchmaking
        ws: /api/matchmaking
        headers: { Authorization: "Bearer ${token}" }
        timeout: 10s
        steps:
          - send: { type: queue, mode: duel }
          - name: matched
            expect: { json: { "$.type": match }, timeout: 30s }
            extract: { match: "$.match", server: "$.server", ticket: "$.ticket" }
      - name: join
        plugin: udp.send
        with:
          addr: ${server}
          payload: "join ${match} ${ticket}"
          reply: true
          match: "^joined ${match} "
        timeout: 2s
      - loop: 300
        steps:
          - name: input
            plugin: udp.send
            with:
              addr: ${server}
              payload: "input ${match} ${iter} move ${rand(0, 359)} ${rand(0, 100)}"
              reply: true
              match: "^state ${match} "
            timeout: 1s
          - think: 50ms..100ms
      - name: leave
        plugin: udp.send
        with: { addr: "${server}", payload: "leave ${match}", reply: true, match: "^bye ${match}" }
        timeout: 2s
load:
  mode: vus
  stages:
    - { duration: 1m, target: "100" }
    - { duration: 1m, target: "300" }
    - { duration: 3m, target: "300" }
targets:
  - player/input.p95 < 100ms
  - player/input.p99 < 200ms
  - errors < 1%
