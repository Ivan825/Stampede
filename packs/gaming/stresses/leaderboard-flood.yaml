# The end of a tournament or a daily challenge: every player posts a score
# at once and checks where they stand. Score writes and rank reads hit the
# same leaderboard; both should stay quick as writes pile up.
apiVersion: stampede.dev/v1
kind: Scenario
metadata:
  name: gaming-leaderboard-flood
  tags: [pack:gaming, spike]
target:
  baseURL: ${env.TARGET_URL}
journeys:
  - name: final-score
    steps:
      - name: sign in
        post: /api/login
        json: { player: "player-${vu}" }
        check: { status: 200 }
        extract: { token: "$.token" }
      - name: submit score
        post: /api/scores
        headers: { Authorization: "Bearer ${token}" }
        json: { score: "${rand(0, 100000)}" }
        check: { status: 200, json: { "$.rank": exists } }
      - name: my rank
        get: /api/leaderboard/player-${vu}
        check: { status: 200, json: { "$.rank": exists } }
      - name: top 100
        get: /api/leaderboard?limit=100
        check: { status: 200 }
      - think: 1s..2s
load:
  shape: spike
  mode: rate
  start: 20/s
  max: 200/s
  duration: 2m
targets:
  - final-score/submit score.p95 < 300ms
  - final-score/my rank.p95 < 200ms
  - errors < 1%
