# Many long replies streamed at once, each connection open for a minute or
# more. Checks that proxies, load balancers and the server keep long
# streams alive and that tokens per second holds up as streams pile up.
apiVersion: stampede.dev/v1
kind: Scenario
metadata:
  name: llm-long-streams
  tags: [pack:llm-apps, soak]
target:
  baseURL: ${env.TARGET_URL}
  timeout: 10m
journeys:
  - name: long-stream
    steps:
      - name: completion
        sse: /v1/chat/completions
        json:
          model: lab-large
          stream: true
          max_tokens: 2048
          messages: [{ role: user, content: "Write a long technical report on load testing." }]
        until: { match: '"finish_reason":"stop"', duration: 10m }
        check: { status: 200, json: { "$.usage.completion_tokens": 2048 } }
load:
  mode: vus
  vus: 32
  duration: 10m
targets:
  - errors < 1%
