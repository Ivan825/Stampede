# The everyday mix for a chat product: most users join a room and talk,
# some read history without connecting, and some leave a tab open and idle.
apiVersion: stampede.dev/v1
kind: Scenario
metadata:
  name: chat-mix
  description: Weighted conversations, history reads and idle connections across several rooms.
  tags: [pack:chat]
target:
  baseURL: ${env.TARGET_URL}
data:
  rooms: { list: [general, random, support, engineering, sales], mode: random }
journeys:
  - name: chat
    weight: 70
    steps:
      - name: sign in
        post: /api/login
        json: { user: "user-${vu}-${iter}" }
        check: { status: 200 }
        extract: { token: "$.token" }
      - name: connect
        ws: /ws?room=${data.rooms}
        headers: { Authorization: "Bearer ${token}" }
        timeout: 5s
        steps:
          - name: welcome
            expect: { json: { "$.type": welcome } }
          - loop: 5
            steps:
              - think: 2s..6s
              - send: { type: typing }
              - send: { type: say, text: "hello from ${vu} (${iter})" }
              - name: ack
                expect: { json: { "$.type": ack }, timeout: 5s }
          - send: { type: ping }
          - name: pong
            expect: { json: { "$.type": pong }, timeout: 5s }
  - name: read-history
    weight: 20
    steps:
      - get: /api/rooms
        check: { status: 200, json: { "$.rooms[0].id": exists } }
      - think: 1s..2s
      - get: /api/rooms/${data.rooms}/messages?limit=50
        check: { status: 200, json: { "$.messages": exists } }
  - name: idle-tab
    weight: 10
    steps:
      - name: sign in
        post: /api/login
        json: { user: "idle-${vu}-${iter}" }
        check: { status: 200 }
        extract: { token: "$.token" }
      - name: connect
        ws: /ws?room=${data.rooms}
        headers: { Authorization: "Bearer ${token}" }
        timeout: 5s
        steps:
          - name: welcome
            expect: { json: { "$.type": welcome } }
          - think: 20s..40s
          - send: { type: ping }
          - name: pong
            expect: { json: { "$.type": pong }, timeout: 5s }
load:
  mode: rate
  rate: 5/s
  duration: 5m
targets:
  - chat/ack.p95 < 250ms
  - chat/connect.p99 < 1s
  - errors < 1%
