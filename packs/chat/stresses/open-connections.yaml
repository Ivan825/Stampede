# Thousands of mostly idle connections held open at once, each pinging
# now and then like a client heartbeat. Finds file-descriptor, memory and
# proxy idle-timeout limits; ping latency should not grow with the count.
# Past about 10,000 connections per worker, raise `ulimit -n` and spread
# the load over workers (see docs/protocols.md).
apiVersion: stampede.dev/v1
kind: Scenario
metadata:
  name: chat-open-connections
  tags: [pack:chat, soak]
target:
  baseURL: ${env.TARGET_URL}
data:
  rooms: { list: [general, random, support, engineering, sales], mode: random }
journeys:
  - name: heartbeat
    steps:
      - name: sign in
        post: /api/login
        json: { user: "device-${vu}" }
        check: { status: 200 }
        extract: { token: "$.token" }
      - name: connect
        ws: /ws?room=${data.rooms}
        headers: { Authorization: "Bearer ${token}" }
        timeout: 10s
        steps:
          - name: welcome
            expect: { json: { "$.type": welcome }, timeout: 10s }
          - loop: 4
            steps:
              - think: 10s..20s
              - send: { type: ping }
              - name: pong
                expect: { json: { "$.type": pong }, timeout: 10s }
load:
  mode: vus
  stages:
    - { duration: 2m, target: "2000" }
    - { duration: 5m, target: "2000" }
targets:
  - heartbeat/pong.p95 < 200ms
  - heartbeat/connect.p99 < 2s
  - errors < 1%
