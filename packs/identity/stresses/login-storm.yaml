# Everyone signs in at once: the start of the working day, the end of an
# outage, or a mobile app release that logs every user out. Password
# hashing is deliberately expensive, so this finds how many sign-ins per
# second the service can take and whether other requests suffer.
apiVersion: stampede.dev/v1
kind: Scenario
metadata:
  name: identity-login-storm
  tags: [pack:identity, spike]
target:
  baseURL: ${env.TARGET_URL}
vars:
  clientId: web
data:
  users: { csv: ../data/users.csv, mode: unique, onExhausted: wrap }
journeys:
  - name: sign-in
    steps:
      - name: password grant
        post: /oauth/token
        form: { grant_type: password, username: "${data.users.email}", password: "${data.users.password}", client_id: "${vars.clientId}" }
        check: { status: 200 }
        extract: { access: "$.access_token" }
      - name: userinfo
        get: /userinfo
        headers: { Authorization: "Bearer ${access}" }
        check: { status: 200 }
load:
  shape: spike
  mode: rate
  start: 10/s
  max: 150/s
  duration: 5m
targets:
  - "sign-in/password grant.p95 < 1s"
  - "sign-in/userinfo.p95 < 200ms"
  - errors < 1%
