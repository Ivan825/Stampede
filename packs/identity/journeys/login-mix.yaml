# The everyday mix for a token service: users sign in, long sessions are
# kept alive with refresh tokens, services fetch their own tokens and
# introspect them, and some users sign out.
apiVersion: stampede.dev/v1
kind: Scenario
metadata:
  name: identity-login-mix
  description: Weighted sign-in, refresh, service-token and sign-out journeys against an OAuth 2.0 / OIDC token service.
  tags: [pack:identity]
target:
  baseURL: ${env.TARGET_URL}
vars:
  clientId: web
  serviceClient: reporting-service
  # AuthLab's demo secret. For a real provider use ${secret.CLIENT_SECRET}.
  serviceSecret: authlab-secret
data:
  users: { csv: ../data/users.csv, mode: random }
journeys:
  - name: sign-in
    weight: 45
    steps:
      - name: password grant
        post: /oauth/token
        form: { grant_type: password, username: "${data.users.email}", password: "${data.users.password}", client_id: "${vars.clientId}", scope: openid profile email }
        check: { status: 200, json: { "$.token_type": Bearer, "$.refresh_token": exists } }
        extract: { access: "$.access_token" }
      - name: userinfo
        get: /userinfo
        headers: { Authorization: "Bearer ${access}" }
        check: { status: 200, json: { "$.sub": exists } }
  - name: long-session
    weight: 35
    steps:
      - name: password grant
        post: /oauth/token
        form: { grant_type: password, username: "${data.users.email}", password: "${data.users.password}", client_id: "${vars.clientId}" }
        check: { status: 200 }
        extract: { access: "$.access_token", refresh: "$.refresh_token" }
      - loop: 3
        steps:
          - think: 2s..5s
          - name: refresh
            post: /oauth/token
            form: { grant_type: refresh_token, refresh_token: "${refresh}", client_id: "${vars.clientId}" }
            check: { status: 200 }
            extract: { access: "$.access_token", refresh: "$.refresh_token" }
          - name: userinfo
            get: /userinfo
            headers: { Authorization: "Bearer ${access}" }
            check: { status: 200 }
  - name: service-token
    weight: 15
    steps:
      - name: client credentials
        post: /oauth/token
        form: { grant_type: client_credentials, client_id: "${vars.serviceClient}", client_secret: "${vars.serviceSecret}" }
        check: { status: 200 }
        extract: { access: "$.access_token" }
      - name: introspect
        post: /oauth/introspect
        form: { token: "${access}", client_id: "${vars.serviceClient}", client_secret: "${vars.serviceSecret}" }
        check: { status: 200, json: { "$.active": true } }
  - name: sign-out
    weight: 5
    steps:
      - name: password grant
        post: /oauth/token
        form: { grant_type: password, username: "${data.users.email}", password: "${data.users.password}", client_id: "${vars.clientId}" }
        check: { status: 200 }
        extract: { refresh: "$.refresh_token" }
      - think: 1s..3s
      - name: revoke
        post: /oauth/revoke
        form: { token: "${refresh}", client_id: "${vars.clientId}" }
        check: { status: 200 }
      - name: refresh after sign-out
        post: /oauth/token
        form: { grant_type: refresh_token, refresh_token: "${refresh}", client_id: "${vars.clientId}" }
        check: { status: 400, json: { "$.error": invalid_grant } }
load:
  mode: rate
  rate: 10/s
  duration: 5m
targets:
  - http.p95 < 500ms
  - errors < 1%
  - "sign-in/password grant.p95 < 800ms"
  - "long-session/refresh.p95 < 200ms"
