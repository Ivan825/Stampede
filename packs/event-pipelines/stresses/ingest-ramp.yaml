# How many events a second can the pipeline take in and keep up with?
# Producers ramp from 50 to 500 events a second. Most only publish; one
# in ten also waits for its event to come out processed, so the
# "enriched" age shows the moment the consumers stop keeping up, well
# before publishing itself slows down.
apiVersion: stampede.dev/v1
kind: Scenario
metadata:
  name: event-pipelines-ingest-ramp
  tags: [pack:event-pipelines, ramp]
journeys:
  - name: firehose
    weight: 90
    steps:
      - name: publish
        plugin: kafka.produce
        with:
          brokers: ["${env.KAFKA_BROKERS}"]
          topic: orders
          key: "order-${vu}-${iter}"
          value: '{"order": "${vu}-${iter}", "customer": ${rand(1, 10000)}, "total": ${rand(5, 500)}}'
  - name: tracer
    weight: 10
    steps:
      - name: publish
        plugin: kafka.produce
        with:
          brokers: ["${env.KAFKA_BROKERS}"]
          topic: orders
          key: "trace-${vu}-${iter}"
          value: '{"order": "trace-${vu}-${iter}", "customer": ${rand(1, 10000)}, "total": 1}'
        extract: { partition: "$.partition" }
      - name: enriched
        plugin: kafka.consume
        with:
          brokers: ["${env.KAFKA_BROKERS}"]
          topic: orders.enriched
          partition: ${partition}
          from: start
          key: "trace-${vu}-${iter}"
          latency: age
        timeout: 60s
load:
  mode: rate
  stages:
    - { duration: 1m, target: 50/s }
    - { duration: 1m, target: 150/s }
    - { duration: 1m, target: 300/s }
    - { duration: 1m, target: 500/s }
    - { duration: 2m, target: 500/s }
targets:
  - firehose/publish.p99 < 100ms
  - tracer/enriched.p95 < 2s
  - errors < 1%
