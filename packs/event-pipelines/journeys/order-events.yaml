# The everyday flow of an event pipeline: services publish orders, the
# pipeline's consumer group processes each one and writes the result to
# the next topic, and operators watch consumer lag. Each order journey
# waits for its own event at the other end.
apiVersion: stampede.dev/v1
kind: Scenario
metadata:
  name: event-pipelines-order-events
  description: Publish orders to Kafka and time each one through the pipeline; read consumer lag.
  tags: [pack:event-pipelines]
target:
  baseURL: ${env.TARGET_URL}
journeys:
  - name: order
    weight: 80
    steps:
      - name: publish
        plugin: kafka.produce
        with:
          brokers: ["${env.KAFKA_BROKERS}"]
          topic: orders
          key: "order-${vu}-${iter}"
          value: '{"order": "${vu}-${iter}", "customer": ${rand(1, 10000)}, "total": ${rand(5, 500)}}'
          acks: all
        extract: { partition: "$.partition" }
      - name: enriched                 # the processed event: age = publish to read back
        plugin: kafka.consume
        with:
          brokers: ["${env.KAFKA_BROKERS}"]
          topic: orders.enriched
          partition: ${partition}      # PipelineLab keeps an event's partition
          from: start
          key: "order-${vu}-${iter}"
          latency: age
        check: { json: { "$.json.customer.name": exists } }
        timeout: 30s
      - think: 1s..3s
  - name: lag
    weight: 20
    steps:
      - name: consumer lag
        get: /api/consumer-groups/enricher/lag
        check: { status: 200, json: { "$.lag": exists } }
      - think: 1s..2s
      - name: topics
        get: /api/topics
        check: { status: 200, json: { "$.topics[0].name": exists } }
load:
  mode: rate
  rate: 10/s
  duration: 5m
targets:
  - order/publish.p99 < 100ms
  - order/enriched.p95 < 1s
  - errors < 1%
