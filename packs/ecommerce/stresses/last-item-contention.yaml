# Many buyers race for scarce stock. Losers should get a clean "out of
# stock" answer; afterwards confirm the shop did not sell more than it had.
apiVersion: stampede.dev/v1
kind: Scenario
metadata:
  name: ecommerce-last-item
  tags: [pack:ecommerce, contention, correctness]
target:
  baseURL: ${env.TARGET_URL}
data:
  users: { csv: ../data/users.csv, mode: unique, onExhausted: wrap }
journeys:
  - name: buy-scarce-item
    steps:
      - post: /api/login
        json: { email: "${data.users.email}", password: "${data.users.password}" }
        check: { status: 200 }
        extract: { token: "$.token" }
      - post: /api/cart
        headers: { Authorization: "Bearer ${token}" }
        json: { productId: "${rand(1, 10)}", qty: 1 }
        check: { status: 200 }
      - post: /api/checkout
        headers: { Authorization: "Bearer ${token}" }
        check: { status: [201, 409] }
load:
  mode: vus
  vus: 60
  iterations: 300
