# A sale goes live: traffic jumps tenfold in seconds, holds, then falls back.
apiVersion: stampede.dev/v1
kind: Scenario
metadata:
  name: ecommerce-flash-sale
  tags: [pack:ecommerce, spike]
target:
  baseURL: ${env.TARGET_URL}
journeys:
  - name: sale-page
    weight: 8
    steps:
      - get: /api/products?page=1&per_page=20
        check: { status: 200 }
        extract: { productId: "$.products[0].id" }
      - get: /api/products/${productId}
        check: { status: 200 }
  - name: popular-product
    weight: 2
    steps:
      - get: /api/products/${rand(1, 100)}
        check: { status: 200 }
load:
  shape: spike
  mode: rate
  start: 20/s
  max: 200/s
  duration: 5m
targets:
  - http.p95 < 800ms
  - errors < 1%
