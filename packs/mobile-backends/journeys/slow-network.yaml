# A returning user opens the app on a 3G connection: every request pays
# the round trip and the slow downlink, so the number of calls and the
# size of each response decide how long the user stares at a spinner. A
# delta sync that sends only what changed costs one round trip; one that
# sends the whole list adds its download time on top. Compare the step
# times with app-mix.yaml.
apiVersion: stampede.dev/v1
kind: Scenario
metadata:
  name: mobile-slow-network
  description: A returning user's launch over an emulated 3G network.
  tags: [pack:mobile-backends, network]
target:
  baseURL: ${env.TARGET_URL}
  headers: { X-App-Version: 4.2.0 }
  network: { profile: 3g }
data:
  users: { csv: ../data/users.csv, mode: random }
vars:
  # A sync token the app saved last time (MobileLab's counter starts at 1000).
  syncToken: v1000
journeys:
  - name: launch-on-3g
    steps:
      - name: config
        get: /api/v1/config
        headers: { X-Platform: "${data.users.platform}", X-Device-Id: "${data.users.deviceId}" }
        check: { status: 200 }
      - name: sign in
        post: /api/v1/auth/login
        json: { userId: "${data.users.userId}", password: "${data.users.password}" }
        check: { status: 200 }
        extract: { token: "$.accessToken" }
      - name: delta sync
        post: /api/v1/sync
        headers: { Authorization: "Bearer ${token}" }
        json: { since: "${vars.syncToken}", changes: [] }
        check: { status: 200 }
      - name: home screen
        graphql: /api/v1/graphql
        headers: { Authorization: "Bearer ${token}" }
        operationName: Home
        persisted: true
        query: |
          query Home {
            home { greeting streak unread today(limit: 10) { id title done } suggestions { id title } }
          }
        check: { json: { "$.data.home.greeting": exists } }
load:
  mode: rate
  rate: 2/s
  duration: 2m
targets:
  - "launch-on-3g/config.p95 < 1s"
  - "launch-on-3g/delta sync.p95 < 1s"
  - "launch-on-3g/home screen.p95 < 1s"
  - errors < 1%
